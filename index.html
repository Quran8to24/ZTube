<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec4'/%3E%3Cstop offset='1' stop-color='%237873f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8 8h48v11L24 45h32v11H8V45l32-26H8z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2d2a4a;--muted:#6b6890;--p1:#ff6ec4;--p2:#7873f5}
  *{box-sizing:border-box}
  body{font-family:'Poppins',system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
       background:linear-gradient(160deg,#fff1f8 0%,#eef2ff 55%,#e6fbff 100%) fixed}
  nav{display:flex;gap:22px;padding:0 24px;height:52px;background:#ffffffd9;backdrop-filter:blur(8px);
      align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #7873f526}
  nav a{color:var(--ink);text-decoration:none;font-weight:500}
  nav a:hover{color:var(--p2)}
  nav a.brand{font-weight:700;font-size:20px;background:linear-gradient(90deg,var(--p1),var(--p2));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  main{padding:24px;max-width:1000px;margin:0 auto}
  h2,h3{margin:.4em 0}
  a{color:var(--p2)}
  button{border:0;border-radius:999px;padding:10px 22px;font:600 15px 'Poppins',system-ui,sans-serif;color:#fff;cursor:pointer;
         background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 4px 14px #7873f540;transition:transform .15s}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:default;transform:none}
  input{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;
        margin:0 8px 10px 0;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--p2)}
  video{width:100%;max-width:640px;background:#1e1b4b;border-radius:16px;display:block;margin-bottom:12px;
        box-shadow:0 10px 30px #7873f533}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:#fff;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;display:block;
        box-shadow:0 6px 20px #7873f524;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7873f53d}
  .thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;position:relative}
  .dur{position:absolute;right:10px;bottom:8px;background:#0000008c;font-size:12px;padding:2px 8px;border-radius:999px}
  .body{padding:12px 16px 14px}
  .tag{background:linear-gradient(90deg,#ff6ec4,#ff9a44);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .dim{color:var(--muted);font-size:13px}.err{color:#e11d48}
  .vwrap{position:relative;max-width:640px}
  .pop{position:absolute;left:12px;right:12px;bottom:56px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .hl{background:linear-gradient(90deg,#ffd200,#ff9a44);color:#3b2300;padding:10px 14px;border-radius:14px;font-weight:600;
      box-shadow:0 6px 20px #0006;animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  textarea{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;background:#fff;color:var(--ink);outline:none;width:100%;max-width:420px}
  textarea:focus{border-color:var(--p2)}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;overflow:hidden;background-size:cover;background-position:center}
  .cw{position:relative}
  .delbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;font-size:15px;background:#e11d48;z-index:2}
  .chip{background:#fff;color:var(--ink);box-shadow:0 2px 8px #7873f526;padding:7px 16px}
  .chip.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff}
  main.full{padding:0;max-width:none}
  .reel{height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow-y:scroll;scroll-snap-type:y mandatory;
        background:linear-gradient(160deg,#6a11cb,#2575fc 60%,#ff6ec4)}
  .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center}
  .slide::after{content:'';position:absolute;left:0;right:0;bottom:0;height:35%;
        background:linear-gradient(transparent,#1e1b4bcc);pointer-events:none}
  .slide video{height:100%;width:auto;max-width:100%;margin:0;border-radius:0;box-shadow:none;object-fit:contain}
  .cap{position:absolute;z-index:2;left:18px;right:76px;bottom:22px;color:#fff;text-shadow:0 1px 4px #0008;pointer-events:none}
  .cap .dim{color:#ffffffdd}
  .cap a{pointer-events:auto;color:#fff;font-weight:600}
  .snd{position:absolute;z-index:2;right:16px;bottom:26px;width:46px;height:46px;padding:0;font-size:20px;
       background:#ffffff38;backdrop-filter:blur(6px);box-shadow:none}
</style>
</head>
<body>
<nav>
  <a href="#/" class="brand">▶ ZTube</a>
  <input id="q" placeholder="🔍 Search" style="width:190px;margin:0;padding:7px 14px;border-radius:999px">
  <a href="#/shorts">Shorts</a>
  <a href="#/live">🔴 Live</a>
  <a href="#/record">Record / Upload</a>
  <span style="flex:1"></span>
  <a href="#/settings" id="me" title="Settings" style="display:none;align-items:center;gap:6px"><span id="meav"></span>⚙</a>
  <span id="who" class="dim"></span>
  <span class="dim" style="font-size:11px">build 9</span>
  <a href="#/login" id="out" style="display:none">Sign out</a>
</nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let sb; // created in boot(), one separate login per browser tab
const app = document.getElementById('app');
const MAX_SECONDS = 300; // keeps recordings under the 50 MB free-tier file limit
let user = null, cleanup = () => {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function route() {
  cleanup(); cleanup = () => {};
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  document.getElementById('me').style.display = user ? 'flex' : 'none';
  if (user) loadMe(); else document.getElementById('who').textContent = '';
  document.getElementById('out').style.display = user ? '' : 'none';
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  app.className = '';
  if (parts[0] === 'login') return loginPage();
  if (!user) { location.hash = '#/login'; return; }
  app.className = parts[0] === 'shorts' ? 'full' : '';
  if (parts[0] === 'shorts') return shortsPage();
  if (parts[0] === 'record') return recordPage();
  if (parts[0] === 'watch') return watchPage(parts[1]);
  if (parts[0] === 'live') return parts[1] ? watchLivePage(parts[1]) : livePage();
  if (parts[0] === 'golive') return goLivePage();
  if (parts[0] === 'channel') return channelPage(parts[1]);
  if (parts[0] === 'search') return searchPage(decodeURIComponent(parts.slice(1).join('/')));
  if (parts[0] === 'settings') return settingsPage();
  return homePage();
}
window.addEventListener('hashchange', route);
document.getElementById('out').onclick = async () => { await sb.auth.signOut(); };

/* ---------- Login ---------- */
function loginPage() {
  app.innerHTML = `<div style="max-width:320px;margin:60px auto"><h2>Sign in</h2>
    <input id="em" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="pw" type="password" placeholder="Password (6+ characters)" style="width:100%;box-sizing:border-box">
    <button id="in">Sign in</button> <button id="up">Create account</button><p id="msg" class="err"></p></div>`;
  const msg = document.getElementById('msg');
  async function go(mode) {
    msg.textContent = '';
    const creds = { email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value };
    const { data, error } = mode === 'in' ? await sb.auth.signInWithPassword(creds) : await sb.auth.signUp(creds);
    if (error) return msg.textContent = error.message;
    if (mode === 'up' && !data.session) return msg.textContent = 'Account created. Check your email to confirm, then sign in.';
    location.hash = '#/';
  }
  document.getElementById('in').onclick = () => go('in');
  document.getElementById('up').onclick = () => go('up');
}


/* ---------- Shared helpers ---------- */
function onLeave(fn) { const prev = cleanup; cleanup = () => { prev(); fn(); }; }
const hue = id => parseInt(id.slice(0, 4), 16) % 360;
const nameHue = str => [...String(str || '?')].reduce((n, c) => n + c.charCodeAt(0), 0) % 360;
// round profile picture (or a colored circle with the first letter if there is no picture)
function avHtml(path, name, size) {
  const h = nameHue(name), letter = esc((name || '?').trim().charAt(0).toUpperCase() || '?');
  return `<span class="av" ${path ? `data-av="${esc(path)}"` : ''} style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px;background-image:linear-gradient(135deg,hsl(${h},80%,65%),hsl(${(h + 50) % 360},80%,60%))">${letter}</span>`;
}
const avCache = {};
async function fillAvatars() {
  const els = [...document.querySelectorAll('[data-av]:not([data-done])')];
  if (!els.length) return;
  els.forEach(e => e.dataset.done = '1');
  const need = [...new Set(els.map(e => e.dataset.av).filter(p => !avCache[p]))];
  if (need.length) {
    const { data } = await sb.storage.from('images').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) avCache[d.path] = d.signedUrl; });
  }
  els.forEach(e => {
    const u = avCache[e.dataset.av];
    if (u) { e.style.backgroundImage = `url("${u}")`; e.textContent = ''; }
  });
}
let myProfile = null, meFor = null;
async function loadMe(force) {
  if (!force && myProfile && meFor === user.id) return;
  const { data } = await sb.from('profiles').select('username, display_name, avatar_path').eq('id', user.id).single();
  if (!data) return;
  myProfile = data; meFor = user.id;
  const nm = data.display_name || data.username;
  document.getElementById('who').textContent = nm;
  const box = document.getElementById('meav');
  box.innerHTML = avHtml(data.avatar_path, nm, 30);
}
async function deleteVideo(v) {
  if (!confirm(`Delete "${v.title}"? This can't be undone.`)) return false;
  const { data, error } = await sb.from('videos').delete().eq('id', v.id).select('id');
  if (error || !data?.length) { alert("Couldn't delete: " + (error?.message || 'not allowed')); return false; }
  await sb.storage.from('videos').remove([v.video_path]);
  return true;
}
function wireDeletes(box, list) {
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const v = list.find(x => x.id === b.dataset.del);
    if (v && await deleteVideo(v)) b.closest('.cw')?.remove();
  });
}
function cardsHtml(list) {
  if (!list.length) return '<p class="dim">No videos yet.</p>';
  return '<div class="grid">' + list.map(v => {
    const nm = v.display_name || v.username;
    return `<div class="cw">
    <a class="card" href="#/watch/${esc(v.id)}">
      <div class="thumb" style="background:linear-gradient(135deg,hsl(${hue(v.id)},85%,68%),hsl(${(hue(v.id) + 60) % 360},85%,62%))">▶<span class="dur">${mm(v.duration_seconds)}</span></div>
      <div class="body" style="display:flex;gap:10px">
        ${avHtml(v.avatar_path, nm, 36)}
        <div><div style="font-weight:600">${esc(v.title)} ${v.is_short ? '<span class="tag">SHORT</span>' : ''}</div>
        <div class="dim" style="margin-top:2px">${esc(nm)} · <span data-views="${esc(v.id)}">${v.view_count}</span> views</div></div>
      </div>
    </a>
    ${v.channel_id === user.id ? `<button class="delbtn" data-del="${esc(v.id)}" title="Delete video">🗑</button>` : ''}
    </div>`;
  }).join('') + '</div>';
}
// view counts on any cards on screen update the moment someone watches
function liveViews() {
  const ch = sb.channel('views-' + Math.random().toString(36).slice(2))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'videos' }, p => {
      document.querySelectorAll(`[data-views="${p.new.id}"]`).forEach(e => e.textContent = p.new.view_count);
    }).subscribe();
  onLeave(() => sb.removeChannel(ch));
}
// channel name + picture + live subscriber count + subscribe button (big = used inside the channel page header)
function channelBar(el, channelId, name, avatarPath, big) {
  const mine = channelId === user.id;
  el.innerHTML = `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px">
    ${big ? '' : `<a href="#/channel/${esc(channelId)}" style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:inherit;text-decoration:none">${avHtml(avatarPath, name, 40)}${esc(name)}</a>`}
    <span class="dim"><span id="subn">0</span> subscribers</span>
    ${mine ? (big ? '<a href="#/settings"><button>✏️ Edit profile</button></a>' : '') : '<button id="subbtn">Subscribe</button>'}</div>`;
  const nEl = el.querySelector('#subn'), btn = el.querySelector('#subbtn');
  let subbed = false;
  async function refresh() {
    const { count } = await sb.from('subscriptions').select('*', { count: 'exact', head: true }).eq('channel_id', channelId);
    nEl.textContent = count ?? 0;
    if (btn) {
      const { data } = await sb.from('subscriptions').select('channel_id')
        .eq('subscriber_id', user.id).eq('channel_id', channelId).maybeSingle();
      subbed = !!data;
      btn.textContent = subbed ? 'Subscribed ✓' : 'Subscribe';
      btn.style.background = subbed ? '#b8b5d6' : '';
    }
  }
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    if (subbed) await sb.from('subscriptions').delete().eq('subscriber_id', user.id).eq('channel_id', channelId);
    else await sb.from('subscriptions').insert({ subscriber_id: user.id, channel_id: channelId });
    await refresh(); btn.disabled = false;
  };
  refresh();
  const ch = sb.channel('subs-' + Math.random().toString(36).slice(2))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'subscriptions', filter: `channel_id=eq.${channelId}` }, refresh)
    .subscribe();
  onLeave(() => sb.removeChannel(ch));
}

/* ---------- Channel page ---------- */
async function channelPage(id) {
  app.innerHTML = '<p class="dim">Loading...</p>';
  const { data: ch, error } = await sb.from('channels').select('*').eq('id', id).single();
  if (error) return app.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  const { data: vids } = await sb.from('video_feed').select('*').eq('channel_id', id).order('created_at', { ascending: false });
  const list = vids || [], nm = ch.display_name || ch.username;
  app.innerHTML = `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px">
      ${avHtml(ch.avatar_path, nm, 96)}
      <div><h2 style="margin:0">${esc(nm)}</h2>
        <div class="dim">@${esc(ch.username)} · ${list.length} videos</div>
        ${ch.bio ? `<p style="margin:8px 0;max-width:520px">${esc(ch.bio)}</p>` : ''}
        <div id="chan"></div></div></div>
    <div style="margin:10px 0"><button class="chip on" data-f="all">All</button> <button class="chip" data-f="video">Videos</button> <button class="chip" data-f="short">Shorts</button></div>
    <div id="vids"></div>`;
  channelBar(document.getElementById('chan'), id, nm, ch.avatar_path, true);
  const box = document.getElementById('vids');
  const show = f => { box.innerHTML = cardsHtml(list.filter(v => f === 'all' || (f === 'short') === v.is_short)); };
  show('all'); wireDeletes(box, list);
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    app.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    show(b.dataset.f);
  });
  liveViews();
}

/* ---------- Search ---------- */
async function searchPage(raw) {
  const q = raw.replace(/[,()%_*\\]/g, ' ').trim();
  const qi = document.getElementById('q'); if (qi) qi.value = q;
  if (!q) return app.innerHTML = '<p class="dim">Type something in the search bar.</p>';
  app.innerHTML = `<h2>Results for “${esc(q)}”</h2><div id="res"><p class="dim">Searching...</p></div>`;
  const [vr, cr] = await Promise.all([
    sb.from('video_feed').select('*').or(`title.ilike.%${q}%,description.ilike.%${q}%`).order('created_at', { ascending: false }).limit(60),
    sb.from('channels').select('*').or(`display_name.ilike.%${q}%,username.ilike.%${q}%`).limit(20),
  ]);
  const res = document.getElementById('res'); if (!res) return;
  if (vr.error || cr.error) return res.innerHTML = `<p class="err">${esc((vr.error || cr.error).message)}</p>`;
  const vids = vr.data || [], chans = cr.data || [];
  if (!vids.length && !chans.length) return res.innerHTML = '<p>Nothing found. Try a different word.</p>';
  res.innerHTML = (chans.length ? '<h3>Channels</h3><div class="grid">' + chans.map(c => {
      const nm = c.display_name || c.username;
      return `<a class="card" href="#/channel/${esc(c.id)}" style="display:flex;align-items:center;gap:12px;padding:14px">
        ${avHtml(c.avatar_path, nm, 52)}<div><div style="font-weight:600">${esc(nm)}</div><div class="dim">@${esc(c.username)} · ${c.subscriber_count} subscribers</div></div></a>`;
    }).join('') + '</div>' : '') + (vids.length ? '<h3>Videos</h3><div id="vids"></div>' : '');
  if (vids.length) {
    const box = document.getElementById('vids');
    box.innerHTML = cardsHtml(vids); wireDeletes(box, vids); liveViews();
  }
}

/* ---------- Settings ---------- */
async function settingsPage() {
  const { data: me, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error) return app.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  const nm = me.display_name || me.username;
  app.innerHTML = `<h2>Settings</h2>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px">
      <span id="avbox">${avHtml(me.avatar_path, nm, 88)}</span>
      <div><input type="file" id="pic" accept="image/png,image/jpeg,image/webp"><br><span class="dim">Profile picture (PNG, JPG or WebP, up to 5 MB)</span></div></div>
    <p>Display name<br><input id="dn" maxlength="40" value="${esc(me.display_name || '')}"></p>
    <p>Username<br><input id="un" maxlength="30" value="${esc(me.username)}"><br><span class="dim">Letters, numbers and underscores, 3 to 30 characters</span></p>
    <p>Bio<br><textarea id="bio" maxlength="300" rows="3">${esc(me.bio || '')}</textarea></p>
    <button id="save">Save</button> <a href="#/channel/${esc(user.id)}">View my channel</a>
    <p id="msg" class="dim"></p>
    <hr style="border:0;border-top:1px solid #e3e1fb;margin:20px 0">
    <p class="dim">Signed in as ${esc(user.email)}</p><button id="so" style="background:#6b6890">Sign out</button>`;
  const $ = id => document.getElementById(id);
  const say = (t, bad) => { $('msg').className = bad ? 'err' : 'dim'; $('msg').textContent = t; };
  $('so').onclick = () => sb.auth.signOut();
  $('pic').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) return say('Picture must be under 5 MB.', true);
    const ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : 'jpg';
    const path = `${user.id}/avatar-${Date.now()}.${ext}`;
    say('Uploading...');
    const up = await sb.storage.from('images').upload(path, f, { contentType: f.type });
    if (up.error) return say(up.error.message, true);
    const { error } = await sb.from('profiles').update({ avatar_path: path }).eq('id', user.id);
    if (error) return say(error.message, true);
    if (me.avatar_path) sb.storage.from('images').remove([me.avatar_path]);
    me.avatar_path = path;
    $('avbox').innerHTML = avHtml(path, $('dn').value.trim() || $('un').value, 88);
    loadMe(true); say('Picture updated ✓');
  };
  $('save').onclick = async () => {
    const username = $('un').value.trim(), display_name = $('dn').value.trim(), bio = $('bio').value.trim();
    if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) return say('Username must be 3 to 30 letters, numbers or underscores.', true);
    const { error } = await sb.from('profiles').update({ username, display_name: display_name || null, bio: bio || null }).eq('id', user.id);
    if (error) return say(error.code === '23505' ? 'That username is taken.' : error.message, true);
    myNameCache = null; loadMe(true); say('Saved ✓');
  };
}

/* ---------- Home feed ---------- */
async function homePage() {
  app.innerHTML = '<p class="dim">Loading...</p>';
  const { data, error } = await sb.from('video_feed').select('*').order('created_at', { ascending: false });
  if (error) return app.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p>No videos yet. Go to Record / Upload to make the first one.</p>';
  app.innerHTML = '<div id="vids"></div>';
  const box = document.getElementById('vids');
  box.innerHTML = cardsHtml(data); wireDeletes(box, data);
  liveViews();
}

/* ---------- Record / upload ---------- */
function recordPage() {
  app.innerHTML = `<h2>Record or upload</h2>
    <video id="live" autoplay muted playsinline></video>
    <p id="status"></p>
    <div id="controls"><button id="start">Start camera &amp; record</button>
      &nbsp;or pick a file: <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime"></div>
    <div id="review" style="display:none">
      <video id="prev" controls playsinline></video>
      <p id="info"></p>
      <input id="title" placeholder="Title" style="width:300px">
      <button id="upload">Upload</button> <button id="discard">Discard</button>
    </div>
    <p id="msg" class="err"></p>`;
  const $ = id => document.getElementById(id);
  let stream, rec, chunks = [], timer, blob, duration = 0;
  cleanup = () => { clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); };

  function showReview(b, secs) {
    blob = b; duration = secs;
    $('live').style.display = 'none'; $('controls').style.display = 'none'; $('review').style.display = '';
    $('prev').src = URL.createObjectURL(b);
    $('info').textContent = `${mm(secs)} · ${secs < 100 ? 'This will be a SHORT' : 'Regular video'} · ${(b.size / 1048576).toFixed(1)} MB`;
  }
  function stop() {
    clearInterval(timer);
    if (rec && rec.state !== 'inactive') rec.stop();
  }
  $('start').onclick = async () => {
    $('msg').textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { height: 720 }, audio: true });
      $('live').srcObject = stream;
      const mime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1000000 });
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const t0 = Date.now();
      rec.onstop = () => {
        const secs = (Date.now() - t0) / 1000;
        stream.getTracks().forEach(t => t.stop());
        $('status').textContent = '';
        showReview(new Blob(chunks, { type: rec.mimeType }), secs);
      };
      rec.start(1000);
      $('controls').innerHTML = '<button id="stop">Stop</button>';
      $('stop').onclick = stop;
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        $('status').textContent = `● Recording ${mm(s)} ${s < 100 ? '(short)' : '(over 1:40, regular video)'}`;
        if (s >= MAX_SECONDS) stop();
      }, 250);
    } catch (e) { $('msg').textContent = 'Could not access camera/mic: ' + e.message; }
  };
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(v.src); showReview(f, d); };
    v.src = URL.createObjectURL(f);
  };
  $('discard').onclick = recordPage;
  $('upload').onclick = async () => {
    const title = $('title').value.trim();
    if (!title) return $('msg').textContent = 'Add a title first.';
    $('upload').disabled = true; $('msg').textContent = 'Uploading...';
    const t = blob.type;
    const ext = t.includes('mp4') ? 'mp4' : t.includes('quicktime') ? 'mov' : 'webm';
    const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from('videos').upload(path, blob, { contentType: t.split(';')[0] });
    if (up.error) { $('upload').disabled = false; return $('msg').textContent = up.error.message; }
    const { data, error } = await sb.from('videos')
      .insert({ channel_id: user.id, title, video_path: path, duration_seconds: Math.max(duration, 0.1) })
      .select('id').single();
    if (error) { $('upload').disabled = false; return $('msg').textContent = error.message; }
    location.hash = '#/watch/' + data.id;
  };
}

/* ---------- Shorts (random order, swipe/scroll) ---------- */
let soundOn = true;
async function shortsPage() {
  app.innerHTML = '<p class="dim" style="padding:20px">Loading shorts...</p>';
  const { data, error } = await sb.from('video_feed').select('*').eq('is_short', true).limit(60);
  if (error) return app.innerHTML = `<p class="err" style="padding:20px">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p style="padding:20px">No shorts yet. Record something under 1:40 and it shows up here.</p>';
  // shuffle (Fisher-Yates) so the order is different every visit
  for (let i = data.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [data[i], data[j]] = [data[j], data[i]]; }
  const { data: urls } = await sb.storage.from('videos').createSignedUrls(data.map(v => v.video_path), 3600);
  const urlFor = {}; (urls || []).forEach(u => { if (u.signedUrl) urlFor[u.path] = u.signedUrl; });
  const list = data.filter(v => urlFor[v.video_path]);
  if (!list.length) return app.innerHTML = '<p class="err" style="padding:20px">Could not load the short videos.</p>';

  app.innerHTML = '<div class="reel">' + list.map(v => `
    <section class="slide" data-id="${esc(v.id)}">
      <video loop playsinline preload="metadata" src="${esc(urlFor[v.video_path])}"></video>
      <div class="cap"><b>${esc(v.title)}</b><br><span class="dim">${esc(v.display_name || v.username)} · <a href="#/watch/${esc(v.id)}">comments</a></span></div>
      <button class="snd">${soundOn ? '🔊' : '🔇'}</button>
    </section>`).join('') + '</div>';

  const reel = app.querySelector('.reel');
  const counted = new Set();
  function play(vid) {
    vid.muted = !soundOn;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const vid = en.target.querySelector('video');
      if (en.isIntersecting) {
        play(vid);
        const id = en.target.dataset.id;
        if (!counted.has(id)) { counted.add(id); sb.rpc('increment_view', { p_video_id: id }); }
      } else { vid.pause(); vid.currentTime = 0; }
    });
  }, { root: reel, threshold: 0.7 });
  reel.querySelectorAll('.slide').forEach(sl => {
    io.observe(sl);
    const vid = sl.querySelector('video');
    vid.onclick = () => vid.paused ? vid.play() : vid.pause();
    sl.querySelector('.snd').onclick = () => {
      soundOn = !soundOn;
      reel.querySelectorAll('.snd').forEach(b => b.textContent = soundOn ? '🔊' : '🔇');
      reel.querySelectorAll('video').forEach(x => x.muted = !soundOn);
    };
  });
  cleanup = () => io.disconnect();
}

/* ---------- Livestream (free, peer-to-peer: video goes straight from streamer to viewers) ---------- */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let myNameCache = null;
async function myName() {
  if (!myNameCache) {
    const { data } = await sb.from('profiles').select('username, display_name').eq('id', user.id).single();
    myNameCache = data?.display_name || data?.username || 'Guest';
  }
  return myNameCache;
}
async function addIce(pc, cand) {
  if (pc.remoteDescription) { try { await pc.addIceCandidate(cand); } catch (e) {} } else (pc._q = pc._q || []).push(cand);
}
async function flushIce(pc) { while (pc._q && pc._q.length) { try { await pc.addIceCandidate(pc._q.shift()); } catch (e) {} } }
function chatHtml() {
  return `<h3>Live chat</h3><div id="chatlog" style="height:260px;overflow-y:auto;background:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px #7873f524;margin-bottom:10px"></div>
    <input id="chattxt" placeholder="Say something" style="width:180px"><button id="chatsend">Send</button>
    <button id="chathl" title="Make your message stand out" style="margin-left:6px">⭐</button>
    <div id="hlpanel" style="display:none;background:#fff;border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 6px 20px #7873f524">
      <b>Solve these to make your message stand out:</b>
      <p style="margin:10px 0 4px">10 × 5 = <input id="hl1" inputmode="numeric" style="width:70px;margin:0"></p>
      <p style="margin:4px 0">3 × 40 = <input id="hl2" inputmode="numeric" style="width:70px;margin:0"></p>
      <p style="margin:4px 0 10px">12 × 5 = <input id="hl3" inputmode="numeric" style="width:70px;margin:0"></p>
      <button id="hlgo">⭐ Send highlighted</button> <span id="hlmsg" class="err" style="margin-left:6px"></span>
    </div>`;
}
function addChat(name, text, hl) {
  const log = document.getElementById('chatlog'); if (!log) return;
  const style = hl
    ? 'margin:8px 0;padding:8px 12px;border-radius:12px;font-weight:600;background:linear-gradient(90deg,#ffe29a,#ffb3c6);box-shadow:0 0 14px #ffb74d99'
    : 'margin:4px 0';
  log.insertAdjacentHTML('beforeend', `<p style="${style}">${hl ? '⭐ ' : ''}<b>${esc(name)}</b> ${esc(text)}</p>`);
  log.scrollTop = log.scrollHeight;
}
// a highlighted message also pops up on top of the stream for 8 seconds
function popup(name, text) {
  const box = document.getElementById('pop'); if (!box) return;
  const el = document.createElement('div'); el.className = 'hl';
  el.innerHTML = `⭐ <b>${esc(name)}</b> ${esc(text)}`;
  box.appendChild(el); setTimeout(() => el.remove(), 8000);
}
function wireChat(ch, name) {
  const $ = id => document.getElementById(id);
  const send = hl => {
    const t = $('chattxt').value.trim(); if (!t) return false;
    ch.send({ type: 'broadcast', event: 'chat', payload: { name, text: t.slice(0, 300), hl: !!hl } });
    addChat(name, t.slice(0, 300), hl); if (hl) popup(name, t.slice(0, 300)); $('chattxt').value = '';
    return true;
  };
  $('chatsend').onclick = () => send(false);
  $('chattxt').onkeydown = e => { if (e.key === 'Enter') send(false); };
  $('chathl').onclick = () => {
    const panel = $('hlpanel');
    panel.style.display = panel.style.display === 'none' ? '' : 'none';
    $('hlmsg').textContent = '';
  };
  $('hlgo').onclick = () => {
    if (!$('chattxt').value.trim()) return $('hlmsg').textContent = 'Type your message first.';
    const ok = $('hl1').value.trim() === '50' && $('hl2').value.trim() === '120' && $('hl3').value.trim() === '60';
    if (!ok) return $('hlmsg').textContent = 'Not quite, try again.';
    send(true);
    ['hl1', 'hl2', 'hl3'].forEach(id => $(id).value = '');
    $('hlpanel').style.display = 'none'; $('hlmsg').textContent = '';
  };
  ch.on('broadcast', { event: 'chat' }, ({ payload }) => { addChat(payload.name, payload.text, payload.hl === true); if (payload.hl === true) popup(payload.name, payload.text); });
}

/* Streamer */
async function goLivePage() {
  app.innerHTML = `<h2>Go live</h2>
    <div style="display:flex;gap:20px;flex-wrap:wrap"><div style="flex:2;min-width:300px">
      <div class="vwrap"><video id="prev" autoplay muted playsinline></video><div class="pop" id="pop"></div></div>
      <div id="setup"><input id="ttl" placeholder="Stream title" style="width:260px"><button id="start">Go live</button></div>
      <div id="onair" style="display:none"><b style="color:#e11d48">● You are live</b> · <span id="vc">0</span> watching <button id="end" style="margin-left:10px">End stream</button></div>
      <p id="msg" class="err"></p></div>
      <div style="flex:1;min-width:260px">${chatHtml()}</div></div>`;
  const $ = id => document.getElementById(id);
  const name = await myName();
  let stream, ch, beat; const pcs = {};
  const count = () => { const el = $('vc'); if (el) el.textContent = Object.values(pcs).filter(pc => pc.connectionState === 'connected').length; };
  onLeave(() => {
    clearInterval(beat);
    Object.values(pcs).forEach(pc => pc.close());
    stream?.getTracks().forEach(t => t.stop());
    if (ch) sb.removeChannel(ch);
    sb.from('live_streams').delete().eq('host_id', user.id).then(() => {});
  });
  $('end').onclick = () => { location.hash = '#/live'; };
  $('start').onclick = async () => {
    const title = $('ttl').value.trim().slice(0, 100) || 'Live stream';
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { height: 480 }, audio: true }); }
    catch (e) { return $('msg').textContent = 'Could not access camera/mic: ' + e.message; }
    $('prev').srcObject = stream;
    $('setup').style.display = 'none'; $('onair').style.display = '';
    ch = sb.channel('live-' + user.id, { config: { broadcast: { self: false } } });
    wireChat(ch, name);
    ch.on('broadcast', { event: 'join' }, async ({ payload }) => {
        const viewer = payload.from;
        pcs[viewer]?.close();
        const pc = new RTCPeerConnection(ICE); pcs[viewer] = pc;
        stream.getTracks().forEach(t => pc.addTrack(t, stream));
        pc.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'ice', payload: { to: viewer, from: user.id, candidate: e.candidate } });
        pc.onconnectionstatechange = count;
        await pc.setLocalDescription(await pc.createOffer());
        ch.send({ type: 'broadcast', event: 'offer', payload: { to: viewer, sdp: pc.localDescription } });
      })
      .on('broadcast', { event: 'answer' }, async ({ payload }) => {
        const pc = pcs[payload.from];
        if (payload.to !== user.id || !pc || pc.signalingState !== 'have-local-offer') return;
        await pc.setRemoteDescription(payload.sdp); await flushIce(pc);
      })
      .on('broadcast', { event: 'ice' }, ({ payload }) => {
        if (payload.to === user.id && pcs[payload.from]) addIce(pcs[payload.from], payload.candidate);
      })
      .subscribe();
    const announce = async () => {
      const { error } = await sb.from('live_streams').upsert({ host_id: user.id, title, name });
      if (error) $('msg').textContent = 'Could not list your stream: ' + error.message;
    };
    announce(); beat = setInterval(announce, 15000);
  };
}

/* Viewer */
async function watchLivePage(hostId) {
  const name = await myName();
  app.innerHTML = `<div style="display:flex;gap:20px;flex-wrap:wrap"><div style="flex:2;min-width:300px">
      <h2>🔴 Live</h2><div class="vwrap"><video id="lv" controls autoplay playsinline></video><div class="pop" id="pop"></div></div>
      <p id="st" class="dim">Connecting...</p></div>
      <div style="flex:1;min-width:260px">${chatHtml()}</div></div>`;
  const setSt = t => { const el = document.getElementById('st'); if (el) el.textContent = t; };
  let pc, connected = false, tries = 0, retry;
  const ch = sb.channel('live-' + hostId, { config: { broadcast: { self: false } } });
  wireChat(ch, name);
  ch.on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (payload.to !== user.id) return;
      pc?.close();
      const mine = pc = new RTCPeerConnection(ICE);
      pc.ontrack = e => { const v = document.getElementById('lv'); if (v) v.srcObject = e.streams[0]; };
      pc.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'ice', payload: { to: hostId, from: user.id, candidate: e.candidate } });
      pc.onconnectionstatechange = () => {
        if (mine !== pc) return;
        const st = mine.connectionState;
        connected = st === 'connected';
        if (st === 'connected') setSt('Live');
        else if (st === 'failed') setSt("Couldn't connect. Some school or work networks block live video.");
        else if (st === 'disconnected' || st === 'closed') setSt('The stream ended.');
      };
      await pc.setRemoteDescription(payload.sdp); await flushIce(pc);
      await pc.setLocalDescription(await pc.createAnswer());
      ch.send({ type: 'broadcast', event: 'answer', payload: { to: hostId, from: user.id, sdp: pc.localDescription } });
    })
    .on('broadcast', { event: 'ice' }, ({ payload }) => {
      if (payload.to === user.id && payload.from === hostId && pc) addIce(pc, payload.candidate);
    })
    .subscribe(st => {
      if (st !== 'SUBSCRIBED') return;
      const join = () => ch.send({ type: 'broadcast', event: 'join', payload: { from: user.id } });
      join();
      retry = setInterval(() => {
        if (connected) return clearInterval(retry);
        if (++tries > 8) { clearInterval(retry); if (!pc) setSt('This stream is not live.'); return; }
        if (!pc) join();
      }, 4000);
    });
  onLeave(() => { clearInterval(retry); pc?.close(); sb.removeChannel(ch); });
}

/* ---------- Boot: every tab gets its own private login ---------- */
async function boot() {
  const claim = id => new Promise(resolve => {
    if (!navigator.locks) return resolve(true);
    // a tab "owns" its id for as long as it is open; a duplicated tab finds it taken
    navigator.locks.request('ztube-tab-' + id, { ifAvailable: true }, lock => {
      if (!lock) { resolve(false); return; }
      resolve(true);
      return new Promise(() => {});
    });
  });
  let id = sessionStorage.getItem('ztube-tab');
  if (!id || !(await claim(id))) {
    const old = id;
    id = Math.random().toString(36).slice(2);
    await claim(id);
    if (old) { // duplicated tab: start with the same account, but a separate login from here on
      const copy = sessionStorage.getItem('ztube-auth-' + old);
      if (copy) sessionStorage.setItem('ztube-auth-' + id, copy);
    }
    sessionStorage.setItem('ztube-tab', id);
  }
  sb = supabase.createClient(
    'https://ejwcxwzxlekoutknngtz.supabase.co',
    'sb_publishable_b_XTX9vAZkQoW8TfafjMgQ_vn-nR0Ye',
    { auth: { storage: window.sessionStorage, storageKey: 'ztube-auth-' + id } }
  );
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { myProfile = null; location.hash = '#/login'; } });
  new MutationObserver(() => fillAvatars()).observe(document.body, { childList: true, subtree: true });
  document.getElementById('q').addEventListener('keydown', e => {
    const v = e.target.value.trim();
    if (e.key === 'Enter' && v) location.hash = '#/search/' + encodeURIComponent(v);
  });
}
