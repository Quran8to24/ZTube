<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec4'/%3E%3Cstop offset='1' stop-color='%237873f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8 8h48v11L24 45h32v11H8V45l32-26H8z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2d2a4a;--muted:#6b6890;--p1:#ff6ec4;--p2:#7873f5}
  *{box-sizing:border-box}
  body{font-family:'Poppins',system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
       background:linear-gradient(160deg,#fff1f8 0%,#eef2ff 55%,#e6fbff 100%) fixed}
  nav{display:flex;gap:22px;padding:0 24px;height:52px;background:#ffffffd9;backdrop-filter:blur(8px);
      align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #7873f526}
  nav a{color:var(--ink);text-decoration:none;font-weight:500}
  nav a:hover{color:var(--p2)}
  nav a.brand{font-weight:700;font-size:20px;background:linear-gradient(90deg,var(--p1),var(--p2));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  main{padding:24px;max-width:1000px;margin:0 auto}
  h2,h3{margin:.4em 0}
  a{color:var(--p2)}
  button{border:0;border-radius:999px;padding:10px 22px;font:600 15px 'Poppins',system-ui,sans-serif;color:#fff;cursor:pointer;
         background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 4px 14px #7873f540;transition:transform .15s}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:default;transform:none}
  input{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;
        margin:0 8px 10px 0;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--p2)}
  video{width:100%;max-width:640px;background:#1e1b4b;border-radius:16px;display:block;margin-bottom:12px;
        box-shadow:0 10px 30px #7873f533}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:#fff;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;display:block;
        box-shadow:0 6px 20px #7873f524;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7873f53d}
  .thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;position:relative}
  .dur{position:absolute;right:10px;bottom:8px;background:#0000008c;font-size:12px;padding:2px 8px;border-radius:999px}
  .body{padding:12px 16px 14px}
  .tag{background:linear-gradient(90deg,#ff6ec4,#ff9a44);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .dim{color:var(--muted);font-size:13px}.err{color:#e11d48}
  .vwrap{position:relative;max-width:640px}
  .pop{position:absolute;left:12px;right:12px;bottom:56px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .hl{background:linear-gradient(90deg,#ffd200,#ff9a44);color:#3b2300;padding:10px 14px;border-radius:14px;font-weight:600;
      box-shadow:0 6px 20px #0006;animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  textarea{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;background:#fff;color:var(--ink);outline:none;width:100%;max-width:420px}
  textarea:focus{border-color:var(--p2)}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;overflow:hidden;background-size:cover;background-position:center}
  .cw{position:relative}
  .delbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;font-size:15px;background:#e11d48;z-index:2}
  .chip{background:#fff;color:var(--ink);box-shadow:0 2px 8px #7873f526;padding:7px 16px}
  .chip.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff}
  nav:not(.in) .mem, nav:not(.in) #me, nav:not(.in) #who, nav:not(.in) #out{display:none !important}
  main.full{padding:0;max-width:none}
  .reel{height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow-y:scroll;scroll-snap-type:y mandatory;
        background:linear-gradient(160deg,#6a11cb,#2575fc 60%,#ff6ec4)}
  .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center}
  .slide::after{content:'';position:absolute;left:0;right:0;bottom:0;height:35%;
        background:linear-gradient(transparent,#1e1b4bcc);pointer-events:none}
  .slide video{height:100%;width:auto;max-width:100%;margin:0;border-radius:0;box-shadow:none;object-fit:contain}
  .cap{position:absolute;z-index:2;left:18px;right:76px;bottom:22px;color:#fff;text-shadow:0 1px 4px #0008;pointer-events:none}
  .cap .dim{color:#ffffffdd}
  .cap a{pointer-events:auto;color:#fff;font-weight:600}
  .snd{position:absolute;z-index:2;right:16px;bottom:26px;width:46px;height:46px;padding:0;font-size:20px;
       background:#ffffff38;backdrop-filter:blur(6px);box-shadow:none}
</style>
</head>
<body>
<nav>
  <a href="#/" class="brand">▶ ZTube</a>
  <input id="q" class="mem" placeholder="🔍 Search" style="width:190px;margin:0;padding:7px 14px;border-radius:999px">
  <a href="#/shorts" class="mem">Shorts</a>
  <a href="#/live" id="livelink" class="mem">🔴 Live</a>
  <a href="#/facechat" class="mem">🔒 Owner Only</a>
  <a href="#/record" class="mem">Record / Upload</a>
  <span style="flex:1"></span>
  <a href="#/admin" id="admbtn" title="Admin" style="width:18px;height:18px;background:#111;border-radius:3px;display:inline-block;flex:none;margin-right:4px"></a>
  <a href="#/settings" id="me" title="Settings" style="display:none;align-items:center;gap:6px"><span id="meav"></span>⚙</a>
  <span id="who" class="dim"></span>
  <span class="dim" style="font-size:11px">beta 2.0</span>
  <a href="#/login" id="out" style="display:none">Sign out</a>
</nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let sb; // created in boot(), one separate login per browser tab
const app = document.getElementById('app');
const MAX_SECONDS = 300; // keeps recordings under the 50 MB free-tier file limit
let user = null, cleanup = () => {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function route() {
  cleanup(); cleanup = () => {};
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  document.querySelector('nav').classList.toggle('in', !!user);
  document.getElementById('me').style.display = user ? 'flex' : 'none';
  if (user) { loadMe(); ensureInbox(); beat(); } else document.getElementById('who').textContent = '';
  document.getElementById('out').style.display = user ? '' : 'none';
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  app.className = '';
  if (parts[0] === 'login') return loginPage();
  if (parts[0] === 'request') return requestPage();
  if (!user) { location.hash = '#/login'; return; }
  app.className = parts[0] === 'shorts' ? 'full' : '';
  if (parts[0] === 'shorts') return shortsPage();
  if (ownerSession && parts[0] !== 'facechat') { ownerSession = false; ownerUnlocked = false; }
  if (parts[0] === 'admin') return adminGate();
  // ban check
  if (user && parts[0] !== 'login') { const { data: ban } = await sb.rpc('is_banned'); if (ban) return bannedPage(); }
  if (parts[0] === 'facechat') return ownerGateCheck(parts[1]);
  if (parts[0] === 'fcredeem') return redeemInvitePage(parts.slice(1).join('/'));
  if (parts[0] === 'call') return callPage(parts[1], parts[2]);
  if (parts[0] === 'record') return recordPage();
  if (parts[0] === 'watch') return watchPage(parts[1]);
  if (parts[0] === 'live') return parts[1] ? watchLivePage(parts[1]) : livePage();
  if (parts[0] === 'golive') return goLivePage();
  if (parts[0] === 'channel') return channelPage(parts[1]);
  if (parts[0] === 'search') return searchPage(decodeURIComponent(parts.slice(1).join('/')));
  if (parts[0] === 'settings') return settingsPage();
  return homePage();
}
window.addEventListener('hashchange', route);
document.getElementById('out').onclick = () => signOutNow();

/* ---------- Login ---------- */
function loginPage() {
  app.innerHTML = `<div style="max-width:360px;margin:60px auto">
    <h2 style="text-align:center;margin-bottom:20px">Sign in to ZTube</h2>
    <input id="em" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="pw" type="password" placeholder="Password" style="width:100%;box-sizing:border-box">
    <button id="in" style="width:100%;margin-bottom:10px">Sign in</button>
    <p style="text-align:center;margin:0"><a href="#/request" style="color:var(--p2);font-size:14px">Don't have an account? Request access</a></p>
    <p id="msg" class="err"></p>
  </div>`;
  const msg = document.getElementById('msg');
  document.getElementById('in').onclick = async () => {
    msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('em').value.trim(),
      password: document.getElementById('pw').value
    });
    if (error) return msg.textContent = error.message;
    location.hash = '#/';
  };
  document.getElementById('em').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in').click(); });
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in').click(); });
}

/* ---------- Request access page ---------- */
function requestPage() {
  app.innerHTML = `<div style="max-width:380px;margin:60px auto">
    <h2 style="text-align:center;margin-bottom:6px">Request access</h2>
    <p class="dim" style="text-align:center;margin-bottom:20px">Fill in your details. The owner will review your request.</p>
    <input id="rn" placeholder="Your name" style="width:100%;box-sizing:border-box">
    <input id="re" type="email" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="rp" type="password" placeholder="Choose a password (6+ characters)" style="width:100%;box-sizing:border-box">
    <input id="rp2" type="password" placeholder="Confirm password" style="width:100%;box-sizing:border-box">
    <button id="rsend" style="width:100%;margin-bottom:10px">Send request</button>
    <p style="text-align:center;margin:0"><a href="#/login" style="color:var(--p2);font-size:14px">Already have an account? Sign in</a></p>
    <p id="msg" class="err"></p>
  </div>`;
  const $ = id => document.getElementById(id);
  $('rsend').onclick = async () => {
    $('msg').textContent = ''; $('msg').className = 'err';
    const name = $('rn').value.trim(), email = $('re').value.trim(),
          pw = $('rp').value, pw2 = $('rp2').value;
    if (!name) return $('msg').textContent = 'Enter your name.';
    if (!email) return $('msg').textContent = 'Enter your email.';
    if (pw.length < 6) return $('msg').textContent = 'Password must be at least 6 characters.';
    if (pw !== pw2) return $('msg').textContent = "Passwords don't match.";
    $('rsend').disabled = true; $('msg').className = 'dim'; $('msg').textContent = 'Sending...';
    const { error } = await sb.rpc('submit_access_request', { p_name: name, p_email: email, p_pw: pw });
    $('rsend').disabled = false;
    if (error) { $('msg').className = 'err'; return $('msg').textContent = error.message; }
    $('msg').className = 'dim';
    app.innerHTML = `<div style="max-width:380px;margin:60px auto;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">✅</div>
      <h2>Request sent!</h2>
      <p class="dim">The owner will review your request. If approved, you can sign in with the email and password you chose.</p>
      <a href="#/login"><button style="margin-top:16px">Back to sign in</button></a>
    </div>`;
  };
}

/* ---------- Banned page ---------- */
function bannedPage() {
  sb.auth.signOut();
  app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">🚫</div>
    <h2>Account banned</h2>
    <p class="dim">Your account has been banned from ZTube. If you think this is a mistake, contact the owner.</p>
  </div>`;
}

/* ---------- Admin panel ---------- */
const ADMIN_KEY = 'Nhsi7597'; // <-- set your admin password
let adminUnlocked = false;

function adminGate() {
  if (adminUnlocked) return adminPage();
  app.innerHTML = `<div style="max-width:320px;margin:60px auto;text-align:center">
    <h2>⚙ Admin Panel</h2>
    <p class="dim">Owner access only.</p>
    <input id="apw" type="password" placeholder="Admin password" style="width:100%;margin-bottom:10px">
    <button id="ago">Enter</button>
    <p id="amsg" class="err"></p>
  </div>`;
  const inp = document.getElementById('apw'), btn = document.getElementById('ago');
  const go = () => {
    if (inp.value === ADMIN_KEY) { adminUnlocked = true; adminPage(); }
    else { document.getElementById('amsg').textContent = 'Wrong password.'; inp.value = ''; inp.focus(); }
  };
  btn.addEventListener('click', go);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
}

async function adminPage() {
  app.innerHTML = `<h2>⚙ Admin Panel</h2>
    <div style="display:flex;gap:12px;margin-bottom:20px flex-wrap:wrap">
      <button class="chip on" data-tab="requests">📋 Requests</button>
      <button class="chip" data-tab="members">👥 Members</button>
    </div>
    <div id="atab"></div>`;
  const tabs = app.querySelectorAll('[data-tab]');
  tabs.forEach(b => b.onclick = () => { tabs.forEach(x => x.classList.toggle('on', x === b)); loadTab(b.dataset.tab); });
  loadTab('requests');
}

async function loadTab(tab) {
  const box = document.getElementById('atab'); if (!box) return;
  box.innerHTML = '<p class="dim">Loading...</p>';
  if (tab === 'requests') {
    const { data, error } = await sb.from('access_requests').select('*').eq('status', 'pending').order('created_at');
    if (error) return box.innerHTML = `<p class="err">${esc(error.message)}</p>`;
    if (!data.length) return box.innerHTML = '<p class="dim">No pending requests.</p>';
    box.innerHTML = data.map(r => `
      <div style="background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #7873f51f;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1"><b>${esc(r.name)}</b><br><span class="dim">${esc(r.email)}</span><br><span class="dim" style="font-size:12px">${new Date(r.created_at).toLocaleString()}</span></div>
        <button data-approve="${esc(r.id)}" data-email="${esc(r.email)}" data-pw="${esc(r.pw_encrypted)}">✅ Approve</button>
        <button data-deny="${esc(r.id)}" style="background:#e11d48">❌ Deny</button>
      </div>`).join('');
    box.addEventListener('click', async e => {
      const ab = e.target.closest('[data-approve]'), db = e.target.closest('[data-deny]');
      if (ab) {
        ab.disabled = true;
        const { data: res, error } = await sb.rpc('approve_access_request', { p_request_id: ab.dataset.approve });
        if (error || !res?.ok) {
          ab.disabled = false;
          document.getElementById('atab').insertAdjacentHTML('afterbegin', `<p class="err">${esc(error?.message || res?.reason || 'Could not approve.')}</p>`);
          return;
        }
        ab.closest('div[style]').innerHTML = `<span class="dim">✅ Approved — ${esc(ab.dataset.email)}${res.existed ? ' (account already existed)' : ''}</span>`;
      }
      if (db) {
        db.disabled = true;
        await sb.from('access_requests').update({ status: 'denied' }).eq('id', db.dataset.deny);
        db.closest('div[style]').remove();
      }
    });
  } else {
    const { data, error } = await sb.from('channels').select('*').order('video_count', { ascending: false });
    if (error) return box.innerHTML = `<p class="err">${esc(error.message)}</p>`;
    const { data: bans } = await sb.from('banned_users').select('user_id');
    const bannedIds = new Set((bans || []).map(b => b.user_id));
    box.innerHTML = data.map(m => `
      <div style="background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 14px #7873f51f;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${avHtml(m.avatar_path, m.display_name || m.username, 42)}
        <div style="flex:1"><b>${esc(m.display_name || m.username)}</b> <span class="dim">@${esc(m.username)}</span><br>
          <span class="dim">${m.video_count} videos · ${m.subscriber_count} subscribers ${bannedIds.has(m.id) ? '· <span style="color:#e11d48">BANNED</span>' : ''}</span></div>
        ${m.id !== user.id ? `
          ${bannedIds.has(m.id)
            ? `<button data-unban="${esc(m.id)}" style="background:#16a34a">🔓 Unban</button>`
            : `<button data-ban="${esc(m.id)}" style="background:#f97316">🚫 Ban</button>`}
          <button data-deluser="${esc(m.id)}" style="background:#e11d48">🗑 Delete</button>` : '<span class="dim">You</span>'}
      </div>`).join('');
    box.addEventListener('click', async e => {
      const bb = e.target.closest('[data-ban]'), ub = e.target.closest('[data-unban]'), del = e.target.closest('[data-deluser]');
      if (bb) {
        if (!confirm(`Ban ${bb.dataset.ban}? They will be signed out and blocked.`)) return;
        await sb.from('banned_users').insert({ user_id: bb.dataset.ban });
        loadTab('members');
      }
      if (ub) { await sb.from('banned_users').delete().eq('user_id', ub.dataset.unban); loadTab('members'); }
      if (del) {
        if (!confirm('Delete this account permanently? This cannot be undone.')) return;
        await sb.from('profiles').delete().eq('id', del.dataset.deluser);
        loadTab('members');
      }
    });
  }
}


/* ---------- Shared helpers ---------- */
function onLeave(fn) { const prev = cleanup; cleanup = () => { prev(); fn(); }; }
const hue = id => parseInt(id.slice(0, 4), 16) % 360;
function liveCardsHtml(items) {
  return '<div class="grid">' + items.map(i => `
    <a class="card" href="#/live/${esc(i.host_id)}">
      <div class="thumb" style="background:linear-gradient(135deg,#ff416c,#ff4b2b)">🔴</div>
      <div class="body"><div style="font-weight:600">${esc(i.title)} <span class="tag">LIVE</span></div><div class="dim">${esc(i.name)}</div></div>
    </a>`).join('') + '</div>';
}
const nameHue = str => [...String(str || '?')].reduce((n, c) => n + c.charCodeAt(0), 0) % 360;
// round profile picture (or a colored circle with the first letter if there is no picture)
function avHtml(path, name, size) {
  const h = nameHue(name), letter = esc((name || '?').trim().charAt(0).toUpperCase() || '?');
  return `<span class="av" ${path ? `data-av="${esc(path)}"` : ''} style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px;background-image:linear-gradient(135deg,hsl(${h},80%,65%),hsl(${(h + 50) % 360},80%,60%))">${letter}</span>`;
}
const avCache = {};
async function fillAvatars() {
  const els = [...document.querySelectorAll('[data-av]:not([data-done])')];
  if (!els.length) return;
  els.forEach(e => e.dataset.done = '1');
  const need = [...new Set(els.map(e => e.dataset.av).filter(p => !avCache[p]))];
  if (need.length) {
    const { data } = await sb.storage.from('images').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) avCache[d.path] = d.signedUrl; });
  }
  els.forEach(e => {
    const u = avCache[e.dataset.av];
    if (u) { e.style.backgroundImage = `url("${u}")`; e.textContent = ''; }
  });
}
let myProfile = null, meFor = null;
async function loadMe(force) {
  if (!force && myProfile && meFor === user.id) return;
  const { data } = await sb.from('profiles').select('username, display_name, avatar_path').eq('id', user.id).single();
  if (!data) return;
  myProfile = data; meFor = user.id;
  const nm = data.display_name || data.username;
  document.getElementById('who').textContent = nm;
  const box = document.getElementById('meav');
  box.innerHTML = avHtml(data.avatar_path, nm, 30);
}
async function deleteVideo(v) {
  if (!confirm(`Delete "${v.title}"? This can't be undone.`)) return false;
  const { data, error } = await sb.from('videos').delete().eq('id', v.id).select('id');
  if (error || !data?.length) { alert("Couldn't delete: " + (error?.message || 'not allowed')); return false; }
  await sb.storage.from('videos').remove([v.video_path]);
  return true;
}
function wireDeletes(box, list) {
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const v = list.find(x => x.id === b.dataset.del);
    if (v && await deleteVideo(v)) b.closest('.cw')?.remove();
  });
}
function cardsHtml(list) {
  if (!list.length) return '<p class="dim">No videos yet.</p>';
  return '<div class="grid">' + list.map(v => {
    const nm = v.display_name || v.username;
    return `<div class="cw">
    <a class="card" href="#/watch/${esc(v.id)}">
      <div class="thumb" style="background:linear-gradient(135deg,hsl(${hue(v.id)},85%,68%),hsl(${(hue(v.id) + 60) % 360},85%,62%))">▶<span class="dur">${mm(v.duration_seconds)}</span></div>
      <div class="body" style="display:flex;gap:10px">
        ${avHtml(v.avatar_path, nm, 36)}
        <div><div style="font-weight:600">${esc(v.title)} ${v.was_live ? '<span class="tag" style="background:#e11d48">PAST LIVE</span>' : v.is_short ? '<span class="tag">SHORT</span>' : ''}</div>

/* ---------- Record / upload ---------- */
function recordPage() {
  app.innerHTML = `<h2>Record or upload</h2>
    <video id="live" autoplay muted playsinline></video>
    <p id="status"></p>
    <div id="controls"><button id="start">Start camera &amp; record</button>
      &nbsp;or pick a file: <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime"></div>
    <div id="review" style="display:none">
      <video id="prev" controls playsinline></video>
      <p id="info"></p>
      <input id="title" placeholder="Title" style="width:300px">
      <button id="upload">Upload</button> <button id="discard">Discard</button>
    </div>
    <p id="msg" class="err"></p>`;
  const $ = id => document.getElementById(id);
  let stream, rec, chunks = [], timer, blob, duration = 0;
  cleanup = () => { clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); };

  function showReview(b, secs) {
    blob = b; duration = secs;
    $('live').style.display = 'none'; $('controls').style.display = 'none'; $('review').style.display = '';
    $('prev').src = URL.createObjectURL(b);
    $('info').textContent = `${mm(secs)} · ${secs < 100 ? 'This will be a SHORT' : 'Regular video'} · ${(b.size / 1048576).toFixed(1)} MB`;
  }
  function stop() {
    clearInterval(timer);
    if (rec && rec.state !== 'inactive') rec.stop();
  }
  $('start').onclick = async () => {
    $('msg').textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { height: 720 }, audio: true });
      $('live').srcObject = stream;
      const mime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1000000 });
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const t0 = Date.now();
      rec.onstop = () => {
        const secs = (Date.now() - t0) / 1000;
        stream.getTracks().forEach(t => t.stop());
        $('status').textContent = '';
        showReview(new Blob(chunks, { type: rec.mimeType }), secs);
      };
      rec.start(1000);
      $('controls').innerHTML = '<button id="stop">Stop</button>';
      $('stop').onclick = stop;
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        $('status').textContent = `● Recording ${mm(s)} ${s < 100 ? '(short)' : '(over 1:40, regular video)'}`;
        if (s >= MAX_SECONDS) stop();
      }, 250);
    } catch (e) { $('msg').textContent = 'Could not access camera/mic: ' + e.message; }
  };
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(v.src); showReview(f, d); };
    v.src = URL.createObjectURL(f);
  };
  $('discard').onclick = recordPage;
  $('upload').onclick = async () => {
    const title = $('title').value.trim();
    if (!title) return $('msg').textContent = 'Add a title first.';
    $('upload').disabled = true; $('msg').textContent = 'Uploading...';
    const t = blob.type;
    const ext = t.includes('mp4') ? 'mp4' : t.includes('quicktime') ? 'mov' : 'webm';
    const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from('videos').upload(path, blob, { contentType: t.split(';')[0] });
    if (up.error) { $('upload').disabled = false; return $('msg').textContent = up.error.message; }
    const { data, error } = await sb.from('videos')
      .insert({ channel_id: user.id, title, video_path: path, duration_seconds: Math.max(duration, 0.1) })
      .select('id').single();
    if (error) { $('upload').disabled = false; return $('msg').textContent = error.message; }
    location.hash = '#/watch/' + data.id;
  };
}

let soundOn = true;
async function shortsPage() {
  app.innerHTML = '<p class="dim" style="padding:20px">Loading shorts...</p>';
  const { data, error } = await sb.from('video_feed').select('*').eq('is_short', true).eq('was_live', false).limit(60);
  if (error) return app.innerHTML = `<p class="err" style="padding:20px">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p style="padding:20px">No shorts yet. Record something under 1:40 and it shows up here.</p>';
  // shuffle (Fisher-Yates) so the order is different every visit
  for (let i = data.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [data[i], data[j]] = [data[j], data[i]]; }
  const { data: urls } = await sb.storage.from('videos').createSignedUrls(data.map(v => v.video_path), 3600);
  const urlFor = {}; (urls || []).forEach(u => { if (u.signedUrl) urlFor[u.path] = u.signedUrl; });
  const list = data.filter(v => urlFor[v.video_path]);
  if (!list.length) return app.innerHTML = '<p class="err" style="padding:20px">Could not load the short videos.</p>';

  app.innerHTML = '<div class="reel">' + list.map(v => `
    <section class="slide" data-id="${esc(v.id)}">
      <video loop playsinline preload="metadata" src="${esc(urlFor[v.video_path])}"></video>
      <div class="cap"><b>${esc(v.title)}</b><br><span class="dim">${esc(v.display_name || v.username)} · <a href="#/watch/${esc(v.id)}">comments</a></span></div>
      <button class="snd">${soundOn ? '🔊' : '🔇'}</button>
    </section>`).join('') + '</div>';

  const reel = app.querySelector('.reel');
  const counted = new Set();
  function play(vid) {
    vid.muted = !soundOn;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const vid = en.target.querySelector('video');
      if (en.isIntersecting) {
        play(vid);
        const id = en.target.dataset.id;
        if (!counted.has(id)) { counted.add(id); sb.rpc('increment_view', { p_video_id: id }); }
      } else { vid.pause(); vid.currentTime = 0; }
    });
  }, { root: reel, threshold: 0.7 });
  reel.querySelectorAll('.slide').forEach(sl => {
    io.observe(sl);
    const vid = sl.querySelector('video');
    vid.onclick = () => vid.paused ? vid.play() : vid.pause();
    sl.querySelector('.snd').onclick = () => {
      soundOn = !soundOn;
      reel.querySelectorAll('.snd').forEach(b => b.textContent = soundOn ? '🔊' : '🔇');
      reel.querySelectorAll('video').forEach(x => x.muted = !soundOn);
    };
  });
  cleanup = () => io.disconnect();
}

const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
// ---- Free relay so live video can get through school/strict networks ----
// Sign up free at metered.ca, create an app, then put its name and API key here:
const METERED_APP = 'ztube';   // the part before .metered.live, e.g. 'ztube'
const METERED_KEY = '047899aad9ccb84c486a967a0a4798791d35';   // your API key from the Metered dashboard
let iceCache = null;
async function getIce() {
  if (iceCache) return iceCache;
  if (METERED_APP && METERED_KEY) {
    try {
      const r = await fetch(`https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${METERED_KEY}`);
      if (r.ok) { iceCache = { iceServers: [...ICE.iceServers, ...(await r.json())] }; return iceCache; }
    } catch (e) {}
  }
  return ICE;
}

async function flushIce(pc) { while (pc._q && pc._q.length) { try { await pc.addIceCandidate(pc._q.shift()); } catch (e) {} } }

function wireChat(ch, name) {

    ch.send({ type: 'broadcast', event: 'chat', payload: { name, text: t.slice(0, 300), hl: !!hl } });
    addChat(name, t.slice(0, 300), hl); if (hl) popup(name, t.slice(0, 300)); $('chattxt').value = '';
    return true;
  };
  $('chatsend').onclick = () => send(false);
  $('chattxt').onkeydown = e => { if (e.key === 'Enter') send(false); };
  $('chathl').onclick = () => {

  };

/* ---------- FaceChat: a viewer shares cam + mic with the streamer and you talk both ways ---------- */
// viewer side
function faceChatViewer(ch, hostId, name) {
  const $ = id => document.getElementById(id);
  let local = null, pc = null;
  const say = t => { const el = $('fcs'); if (el) el.textContent = t; };
  const stop = notify => {
    if (notify && local) ch.send({ type: 'broadcast', event: 'fc-end', payload: { from: user.id, to: hostId } });
    pc?.close(); pc = null;
    local?.getTracks().forEach(t => t.stop()); local = null;
    const v = $('fcself'); if (v) { v.srcObject = null; v.style.display = 'none'; }
    const b = $('fcbtn'); if (b) b.textContent = '📹 FaceChat';
  };
  $('fcbtn').onclick = async () => {
    if (local) { stop(true); say(''); return; }
    try { local = await navigator.mediaDevices.getUserMedia({ video: { height: 360 }, audio: true }); }
    catch (e) { return say('Could not access camera/mic: ' + e.message); }
    $('fcself').srcObject = local; $('fcself').style.display = '';
    $('fcbtn').textContent = '⏹ End FaceChat';
    say('Asking the streamer to FaceChat...');
    ch.send({ type: 'broadcast', event: 'fc-request', payload: { from: user.id, to: hostId, name } });
  };
  ch.on('broadcast', { event: 'fc-accept' }, async ({ payload }) => {
      if (payload.to !== user.id || !local) return;
      say('Connecting...');
      const mine = pc = new RTCPeerConnection(await getIce());
      local.getTracks().forEach(t => mine.addTrack(t, local));
      mine.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'fc-ice', payload: { to: hostId, from: user.id, candidate: e.candidate } });
      mine.onconnectionstatechange = () => {
        if (mine !== pc) return;
        if (mine.connectionState === 'connected') say('FaceChat is on. The streamer can see and hear you.');
        else if (mine.connectionState === 'failed') say("Couldn't connect FaceChat.");
      };
      await mine.setLocalDescription(await mine.createOffer());
      ch.send({ type: 'broadcast', event: 'fc-offer', payload: { to: hostId, from: user.id, sdp: mine.localDescription } });
    })
    .on('broadcast', { event: 'fc-answer' }, async ({ payload }) => {
      if (payload.to !== user.id || !pc) return;
      await pc.setRemoteDescription(payload.sdp); await flushIce(pc);
    })
    .on('broadcast', { event: 'fc-ice' }, ({ payload }) => {
      if (payload.to === user.id && payload.from === hostId && pc) addIce(pc, payload.candidate);
    })
    .on('broadcast', { event: 'fc-decline' }, ({ payload }) => {
      if (payload.to !== user.id) return;
      stop(false); say(payload.busy ? 'The streamer is already in a FaceChat.' : 'The streamer declined.');
    })
    .on('broadcast', { event: 'fc-end' }, ({ payload }) => {
      if (payload.to !== user.id) return;
      stop(false); say('FaceChat ended.');
    });
  return () => stop(true);
}
// streamer side: accept one viewer at a time
function faceChatHost(ch, myId) {
  const $ = id => document.getElementById(id);
  let guest = null, pc = null, pending = null;
  const closeGuest = notify => {
    if (notify && guest) ch.send({ type: 'broadcast', event: 'fc-end', payload: { from: myId, to: guest } });
    pc?.close(); pc = null; guest = null;
    const v = $('fcvid'); if (v) v.srcObject = null;
    if ($('fc')) $('fc').style.display = 'none';
  };
  ch.on('broadcast', { event: 'fc-request' }, ({ payload }) => {
      if (payload.to !== myId) return;
      if (guest || pending) return ch.send({ type: 'broadcast', event: 'fc-decline', payload: { to: payload.from, busy: true } });
      pending = payload.from;
      $('fcreqn').textContent = payload.name; $('fcreq').style.display = '';
    })
    .on('broadcast', { event: 'fc-offer' }, async ({ payload }) => {
      if (payload.to !== myId || payload.from !== guest || !pc) return;
      await pc.setRemoteDescription(payload.sdp); await flushIce(pc);
      await pc.setLocalDescription(await pc.createAnswer());
      ch.send({ type: 'broadcast', event: 'fc-answer', payload: { to: guest, from: myId, sdp: pc.localDescription } });
    })
    .on('broadcast', { event: 'fc-ice' }, ({ payload }) => {
      if (payload.to === myId && payload.from === guest && pc) addIce(pc, payload.candidate);
    })
    .on('broadcast', { event: 'fc-end' }, ({ payload }) => {
      if (payload.to === myId && payload.from === guest) closeGuest(false);
    });
  $('fcyes').onclick = async () => {
    guest = pending; pending = null;
    $('fcreq').style.display = 'none';
    $('fcn').textContent = $('fcreqn').textContent; $('fc').style.display = '';
    const who = guest;
    pc = new RTCPeerConnection(await getIce());
    pc.ontrack = e => { const v = $('fcvid'); if (v) v.srcObject = e.streams[0]; };
    pc.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'fc-ice', payload: { to: who, from: myId, candidate: e.candidate } });
    ch.send({ type: 'broadcast', event: 'fc-accept', payload: { to: who } });
  };
  $('fcno').onclick = () => {
    ch.send({ type: 'broadcast', event: 'fc-decline', payload: { to: pending } });
    pending = null; $('fcreq').style.display = 'none';
  };
  $('fcend').onclick = () => closeGuest(true);
  return () => closeGuest(true);
}

/* One-to-one call */
async function callPage(room, role) {
  app.innerHTML = `<h2>📹 FaceChat</h2><p id="cs" class="dim">Starting camera...</p>
    <div class="vwrap" style="max-width:720px"><video id="rem" autoplay playsinline></video></div>
    <video id="loc" muted autoplay playsinline style="width:180px"></video>
    <div><button id="mic">🎤 Mute</button> <button id="cam">📷 Camera off</button> <button id="bye" style="background:#e11d48">End call</button></div>`;
  const $ = id => document.getElementById(id);
  const say = t => { const el = $('cs'); if (el) el.textContent = t; };
  let local, pc = null, gotOffer = false, timers = [], ch;
  const early = [];
  try { local = await navigator.mediaDevices.getUserMedia({ video: { height: 480 }, audio: true }); }
  catch (e) { return say('Could not access camera/mic: ' + e.message); }
  if (!$('loc')) { local.getTracks().forEach(t => t.stop()); return; } // you already left this page
  $('loc').srcObject = local;
  ch = sb.channel('fc-room-' + room, { config: { broadcast: { self: false } } });
  const onDeclined = e => { if (e.detail.room === room) say('They declined the invite.'); };
  window.addEventListener('fc-declined', onDeclined);
  onLeave(() => {
    timers.forEach(clearTimeout); timers.forEach(clearInterval);
    window.removeEventListener('fc-declined', onDeclined);
    ch.send({ type: 'broadcast', event: 'bye', payload: { from: user.id } });
    setTimeout(() => sb.removeChannel(ch), 500);
    pc?.close(); local.getTracks().forEach(t => t.stop());
  });
  const makePc = async () => {
    pc?.close();
    const mine = pc = new RTCPeerConnection(await getIce());
    local.getTracks().forEach(t => mine.addTrack(t, local));
    mine.ontrack = e => { const v = $('rem'); if (v) v.srcObject = e.streams[0]; };
    mine.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'ice', payload: { from: user.id, candidate: e.candidate } });
    mine.onconnectionstatechange = () => {
      if (mine !== pc) return;
      const st = mine.connectionState;
      if (st === 'connected') say('Connected');
      else if (st === 'failed') say("Couldn't connect. Some school or work networks block video calls.");
      else if (st === 'disconnected') say('Connection lost.');
    };
    early.splice(0).forEach(c => addIce(mine, c));
    return mine;
  };
  ch.on('broadcast', { event: 'ready' }, async () => {
      if (role !== 'a') return;
      const mine = await makePc();
      await mine.setLocalDescription(await mine.createOffer());
      ch.send({ type: 'broadcast', event: 'offer', payload: { from: user.id, sdp: mine.localDescription } });
    })
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (role !== 'b') return;
      gotOffer = true;
      const mine = await makePc();
      await mine.setRemoteDescription(payload.sdp); await flushIce(mine);
      await mine.setLocalDescription(await mine.createAnswer());
      ch.send({ type: 'broadcast', event: 'answer', payload: { from: user.id, sdp: mine.localDescription } });
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      if (role !== 'a' || !pc) return;
      await pc.setRemoteDescription(payload.sdp); await flushIce(pc);
    })
    .on('broadcast', { event: 'ice' }, ({ payload }) => {
      if (payload.from === user.id) return;
      if (pc) addIce(pc, payload.candidate); else early.push(payload.candidate);
    })
    .on('broadcast', { event: 'bye' }, () => {
      say('The other person ended the call.');
      pc?.close(); const v = $('rem'); if (v) v.srcObject = null;
    })
    .subscribe(st => {
      if (st !== 'SUBSCRIBED') return;
      if (role === 'a') {
        say('Calling... waiting for them to accept.');
        timers.push(setTimeout(() => { if (!pc) say('No answer. They may be busy or offline.'); }, 45000));
      } else {
        say('Connecting...');
        const ready = () => ch.send({ type: 'broadcast', event: 'ready', payload: { from: user.id } });
        ready();
        let n = 0;
        const iv = setInterval(() => { if (gotOffer || ++n > 10) return clearInterval(iv); ready(); }, 3000);
        timers.push(iv);
      }
    });

/* What you are streaming: face, screen, or screen with a face bubble */
async function getLiveMedia(kind) {
  if (kind === 'face') {
    const s = await navigator.mediaDevices.getUserMedia({ video: { height: 480 }, audio: true });
    return { main: s, cam: null, out: s.getTracks(), all: s.getTracks() };
  }
  const all = [];
  const d = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: true });
  all.push(...d.getTracks());
  let mic = null, camV = null;
  try { // your mic (and camera for face + screen); the stream still works if you say no
    const m = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'both' ? { height: 240 } : false });
    all.push(...m.getTracks());
    mic = m.getAudioTracks()[0] || null; camV = m.getVideoTracks()[0] || null;
  } catch (e) {}
  const screenV = d.getVideoTracks()[0];
  const audio = mic || d.getAudioTracks()[0] || null;
  const main = new MediaStream([screenV, ...(audio ? [audio] : [])]);
  const cam = camV ? new MediaStream([camV]) : null;
  return { main, cam, out: [screenV, ...(audio ? [audio] : []), ...(camV ? [camV] : [])], all };
}

      };
      pc.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'ice', payload: { to: hostId, from: user.id, candidate: e.candidate } });
      pc.onconnectionstatechange = () => {
        if (mine !== pc) return;

/* ---------- Boot: every tab gets its own private login ---------- */
async function boot() {
  const claim = id => new Promise(resolve => {
    if (!navigator.locks) return resolve(true);
    // a tab "owns" its id for as long as it is open; a duplicated tab finds it taken
    navigator.locks.request('ztube-tab-' + id, { ifAvailable: true }, lock => {
      if (!lock) { resolve(false); return; }
      resolve(true);
      return new Promise(() => {});
    });
  });
  let id = sessionStorage.getItem('ztube-tab');
  if (!id || !(await claim(id))) {
    const old = id;
    id = Math.random().toString(36).slice(2);
    await claim(id);
    if (old) { // duplicated tab: start with the same account, but a separate login from here on
      const copy = sessionStorage.getItem('ztube-auth-' + old);
      if (copy) sessionStorage.setItem('ztube-auth-' + id, copy);
    }
    sessionStorage.setItem('ztube-tab', id);
  }
  sb = supabase.createClient(
    'https://ejwcxwzxlekoutknngtz.supabase.co',
    'sb_publishable_b_XTX9vAZkQoW8TfafjMgQ_vn-nR0Ye',
    { auth: { storage: window.sessionStorage, storageKey: 'ztube-auth-' + id } }
  );
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { myProfile = null; location.hash = '#/login'; } });
  new MutationObserver(() => fillAvatars()).observe(document.body, { childList: true, subtree: true });
  if (document.getElementById('invsend')) document.getElementById('invsend').onclick = sendInvite;
  document.getElementById('q').addEventListener('keydown', e => {
    const v = e.target.value.trim();
    if (e.key === 'Enter' && v) location.hash = '#/search/' + encodeURIComponent(v);
  });
}
