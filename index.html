<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec4'/%3E%3Cstop offset='1' stop-color='%237873f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8 8h48v11L24 45h32v11H8V45l32-26H8z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2d2a4a;--muted:#6b6890;--p1:#ff6ec4;--p2:#7873f5}
  *{box-sizing:border-box}
  body{font-family:'Poppins',system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
       background:linear-gradient(160deg,#fff1f8 0%,#eef2ff 55%,#e6fbff 100%) fixed}
  nav{display:flex;gap:22px;padding:0 24px;height:52px;background:#ffffffd9;backdrop-filter:blur(8px);
      align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #7873f526}
  nav a{color:var(--ink);text-decoration:none;font-weight:500}
  nav a:hover{color:var(--p2)}
  nav a.brand{font-weight:700;font-size:20px;background:linear-gradient(90deg,var(--p1),var(--p2));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  main{padding:24px;max-width:1000px;margin:0 auto}
  h2,h3{margin:.4em 0}
  a{color:var(--p2)}
  button{border:0;border-radius:999px;padding:10px 22px;font:600 15px 'Poppins',system-ui,sans-serif;color:#fff;cursor:pointer;
         background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 4px 14px #7873f540;transition:transform .15s}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:default;transform:none}
  input{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;
        margin:0 8px 10px 0;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--p2)}
  video{width:100%;max-width:640px;background:#1e1b4b;border-radius:16px;display:block;margin-bottom:12px;
        box-shadow:0 10px 30px #7873f533}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:#fff;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;display:block;
        box-shadow:0 6px 20px #7873f524;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7873f53d}
  .thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;position:relative}
  .dur{position:absolute;right:10px;bottom:8px;background:#0000008c;font-size:12px;padding:2px 8px;border-radius:999px}
  .body{padding:12px 16px 14px}
  .tag{background:linear-gradient(90deg,#ff6ec4,#ff9a44);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .dim{color:var(--muted);font-size:13px}.err{color:#e11d48}
  .vwrap{position:relative;max-width:640px}
  .pop{position:absolute;left:12px;right:12px;bottom:56px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .hl{background:linear-gradient(90deg,#ffd200,#ff9a44);color:#3b2300;padding:10px 14px;border-radius:14px;font-weight:600;
      box-shadow:0 6px 20px #0006;animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .wscreen{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#fff1f8,#eef2ff,#e6fbff);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  .wscroll{flex:1;overflow-y:auto;width:100%;max-width:720px;padding:48px 32px 24px;box-sizing:border-box}
  .wscroll h1{background:linear-gradient(90deg,#ff6ec4,#7873f5);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px;margin:0 0 6px}
  .wscroll h2{color:#2d2a4a;font-size:18px;margin:28px 0 8px}
  .wscroll p{color:#444;line-height:1.85;margin:0 0 14px;font-size:15px}
  .wscroll ul{color:#444;line-height:1.85;margin:0 0 14px;padding-left:22px;font-size:15px}
  .wscroll li{margin-bottom:6px}
  .wfoot{width:100%;max-width:720px;padding:16px 32px 32px;box-sizing:border-box;background:linear-gradient(to bottom,transparent,#eef2ff 30%)}
  .wbtn{width:100%;padding:16px;font-size:18px;font-weight:700;letter-spacing:.5px;border-radius:999px;cursor:not-allowed;opacity:.4;background:linear-gradient(90deg,#ff6ec4,#7873f5);color:#fff;border:0;transition:opacity .3s}
  .wbtn.ready{opacity:1;cursor:pointer}
  .wscrolltip{text-align:center;font-size:13px;color:#6b6890;margin-bottom:10px}
  textarea{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;background:#fff;color:var(--ink);outline:none;width:100%;max-width:420px}
  textarea:focus{border-color:var(--p2)}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;overflow:hidden;background-size:cover;background-position:center}
  .cw{position:relative}
  .delbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;font-size:15px;background:#e11d48;z-index:2}
  .chip{background:#fff;color:var(--ink);box-shadow:0 2px 8px #7873f526;padding:7px 16px}
  .chip.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff}
  nav:not(.in) .mem, nav:not(.in) #me, nav:not(.in) #who, nav:not(.in) #out{display:none !important}
  main.full{padding:0;max-width:none}
  .reel{height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow-y:scroll;scroll-snap-type:y mandatory;
        background:linear-gradient(160deg,#6a11cb,#2575fc 60%,#ff6ec4)}
  .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center}
  .slide::after{content:'';position:absolute;left:0;right:0;bottom:0;height:35%;
        background:linear-gradient(transparent,#1e1b4bcc);pointer-events:none}
  .slide video{height:100%;width:auto;max-width:100%;margin:0;border-radius:0;box-shadow:none;object-fit:contain}
  .cap{position:absolute;z-index:2;left:18px;right:76px;bottom:22px;color:#fff;text-shadow:0 1px 4px #0008;pointer-events:none}
  .cap .dim{color:#ffffffdd}
  .cap a{pointer-events:auto;color:#fff;font-weight:600}
  .snd{position:absolute;z-index:2;right:16px;bottom:26px;width:46px;height:46px;padding:0;font-size:20px;
       background:#ffffff38;backdrop-filter:blur(6px);box-shadow:none}
  .live-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
  .live-main{position:relative;min-width:0}
  .live-main video{max-width:none;max-height:70vh}
  .live-chat{min-width:0;height:calc(70vh + 32px);min-height:420px;background:#fff;border-radius:16px;padding:14px;
              box-shadow:0 6px 20px #7873f524;display:flex;flex-direction:column}
  .live-chat h3{margin:0 0 8px}
  .live-chat #chatlog{height:auto;flex:1;min-height:180px;margin-bottom:8px}
  .live-chat #chattxt{width:calc(100% - 112px);margin:0 6px 8px 0}
  .live-chat #chatsend{vertical-align:top}
  .live-chat #chathl{width:42px;padding:10px;margin-left:2px}
  .live-chat #chat-msg{margin:4px 0 0}
  .live-chat #hlpanel{margin-top:8px}
  .studio-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px}
  .studio-status{display:flex;align-items:center;gap:8px;color:#e11d48;font-weight:700}
  .studio-status::before{content:'';width:10px;height:10px;border-radius:50%;background:#d9dae8}
  .studio-status.live::before{background:#e11d48;box-shadow:0 0 0 5px #e11d4822}
  .studio-url{display:flex;align-items:center;gap:8px;max-width:520px}
  .studio-url input{width:min(360px,60vw);margin:0;font-size:13px}
  .studio-tabs{display:flex;gap:8px;margin-bottom:14px}
  .studio-tab{background:#fff;color:var(--ink);box-shadow:0 2px 8px #7873f526}
  .studio-tab.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff}
  .studio-metric{background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 20px #7873f524}
  .studio-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
  .studio-metric b{display:block;font-size:20px}
  @media (max-width:780px){.live-layout{grid-template-columns:1fr}.live-chat{height:420px}.studio-head{flex-direction:column}.studio-metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="#/" class="brand">▶ ZTube</a>
  <input id="q" class="mem" placeholder="🔍 Search" style="width:190px;margin:0;padding:7px 14px;border-radius:999px">
  <a href="#/shorts" class="mem">Shorts</a>
  <a href="#/live" id="livelink" class="mem">🔴 Live</a>
  <a href="#/zchat">📹 ZChat</a>
  <a href="#/record" class="mem">Record / Upload</a>
  <span style="flex:1"></span>
  <a href="#/admin" id="admbtn" title="Admin" style="width:18px;height:18px;background:#111;border-radius:3px;display:inline-block;flex:none;margin-right:4px"></a>
  <a href="#/settings" id="me" title="Settings" style="display:none;align-items:center;gap:6px"><span id="meav"></span>⚙</a>
  <span id="who" class="dim"></span>
  <span class="dim" style="font-size:11px">beta 2.0</span>
  <a href="#/login" id="out" style="display:none">Sign out</a>
</nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let sb; // created in boot(), one separate login per browser tab
const app = document.getElementById('app');
const MAX_SECONDS = 300; // keeps recordings under the 50 MB free-tier file limit
let user = null, cleanup = () => {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function route() {
  cleanup(); cleanup = () => {};
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  document.querySelector('nav').classList.toggle('in', !!user);
  document.getElementById('me').style.display = user ? 'flex' : 'none';
  if (user) { loadMe(); ensureInbox(); beat(); } else document.getElementById('who').textContent = '';
  document.getElementById('out').style.display = user ? '' : 'none';
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  app.className = '';
  if (parts[0] === 'login') return loginPage();
  if (parts[0] === 'request') return requestPage();
  if (parts[0] === 'zchat') return zChatPage(parts[1]);
  if (parts[0] === 'call') return callPage(parts[1], parts[2]);
  if (!user) { location.hash = '#/login'; return; }
  app.className = parts[0] === 'shorts' ? 'full' : '';
  if (parts[0] === 'shorts') return shortsPage();
  if (parts[0] === 'admin') return adminGate();
  // ban check
  if (user && parts[0] !== 'login') { const { data: ban } = await sb.rpc('is_banned'); if (ban) return bannedPage(); }
  if (parts[0] === 'record') return recordPage();
  if (parts[0] === 'watch') return watchPage(parts[1]);
  if (parts[0] === 'live') return parts[1] ? watchLivePage(parts[1]) : livePage();
  if (parts[0] === 'golive') return goLivePage(parts[1]);
  if (parts[0] === 'channel') return channelPage(parts[1]);
  if (parts[0] === 'search') return searchPage(decodeURIComponent(parts.slice(1).join('/')));
  if (parts[0] === 'settings') return settingsPage();
  return homePage();
}
window.addEventListener('hashchange', route);
document.getElementById('out').onclick = () => signOutNow();

/* ---------- Login ---------- */
function loginPage() {
  app.innerHTML = `<div style="max-width:360px;margin:60px auto">
    <h2 style="text-align:center;margin-bottom:20px">Sign in to ZTube</h2>
    <input id="em" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="pw" type="password" placeholder="Password" style="width:100%;box-sizing:border-box">
    <button id="in" style="width:100%;margin-bottom:10px">Sign in</button>
    <p style="text-align:center;margin:0"><a href="#/request" style="color:var(--p2);font-size:14px">Don't have an account? Request access</a></p>
    <p style="text-align:center;margin:10px 0 0"><a href="#/zchat" style="color:var(--p2);font-size:14px;font-weight:600">📹 Have a ZChat ID? Click here</a></p>
    <p id="msg" class="err"></p>
  </div>`;
  const msg = document.getElementById('msg');
  document.getElementById('in').onclick = async () => {
    msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('em').value.trim(),
      password: document.getElementById('pw').value
    });
    if (error) return msg.textContent = error.message;
    location.hash = '#/';
  };
  document.getElementById('em').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in').click(); });
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in').click(); });
}

/* ---------- Request access page ---------- */
function requestPage() {
  app.innerHTML = `<div style="max-width:380px;margin:60px auto">
    <h2 style="text-align:center;margin-bottom:6px">Request access</h2>
    <p class="dim" style="text-align:center;margin-bottom:20px">Fill in your details. The owner will review your request.</p>
    <input id="rn" placeholder="Your name" style="width:100%;box-sizing:border-box">
    <input id="re" type="email" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="rp" type="password" placeholder="Choose a password (6+ characters)" style="width:100%;box-sizing:border-box">
    <input id="rp2" type="password" placeholder="Confirm password" style="width:100%;box-sizing:border-box">
    <button id="rsend" style="width:100%;margin-bottom:10px">Send request</button>
    <p style="text-align:center;margin:0"><a href="#/login" style="color:var(--p2);font-size:14px">Already have an account? Sign in</a></p>
    <p id="msg" class="err"></p>
  </div>`;
  const $ = id => document.getElementById(id);
  $('rsend').onclick = async () => {
    $('msg').textContent = ''; $('msg').className = 'err';
    const name = $('rn').value.trim(), email = $('re').value.trim(),
          pw = $('rp').value, pw2 = $('rp2').value;
    if (!name) return $('msg').textContent = 'Enter your name.';
    if (!email) return $('msg').textContent = 'Enter your email.';
    if (pw.length < 6) return $('msg').textContent = 'Password must be at least 6 characters.';
    if (pw !== pw2) return $('msg').textContent = "Passwords don't match.";
    $('rsend').disabled = true; $('msg').className = 'dim'; $('msg').textContent = 'Sending...';
    const { error } = await sb.rpc('submit_access_request', { p_name: name, p_email: email, p_pw: pw });
    $('rsend').disabled = false;
    if (error) { $('msg').className = 'err'; return $('msg').textContent = error.message; }
    $('msg').className = 'dim';
    app.innerHTML = `<div style="max-width:380px;margin:60px auto;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">✅</div>
      <h2>Request sent!</h2>
      <p class="dim">The owner will review your request. If approved, you can sign in with the email and password you chose.</p>
      <a href="#/login"><button style="margin-top:16px">Back to sign in</button></a>
    </div>`;
  };
}

/* ---------- Banned page ---------- */
function bannedPage() {
  sb.auth.signOut();
  app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">🚫</div>
    <h2>Account banned</h2>
    <p class="dim">Your account has been banned from ZTube. If you think this is a mistake, contact the owner.</p>
  </div>`;
}

/* ---------- Admin panel ---------- */
const ADMIN_KEY = 'Nhsi7597';
let adminUnlocked = false;

function adminGate() {
  if (adminUnlocked) return adminPage();
  app.innerHTML = `<div style="max-width:320px;margin:60px auto;text-align:center">
    <h2>⚙ Admin Panel</h2>
    <p class="dim">Owner access only.</p>
    <input id="apw" type="password" placeholder="Admin password" style="width:100%;margin-bottom:10px">
    <button id="ago">Enter</button>
    <p id="amsg" class="err"></p>
  </div>`;
  const inp = document.getElementById('apw');
  const enter = () => {
    if (inp.value === ADMIN_KEY) {
      adminUnlocked = true;
      adminPage();
    } else {
      document.getElementById('amsg').textContent = 'Wrong password.';
      inp.value = '';
      inp.focus();
    }
  };
  document.getElementById('ago').addEventListener('click', enter);
  inp.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      enter();
    }
  });
  inp.focus();
}

async function adminPage() {
  app.innerHTML = `<h2>⚙ Admin Panel</h2>
    <div style="display:flex;gap:12px;margin-bottom:20px flex-wrap:wrap">
      <button class="chip on" data-tab="requests">📋 Requests</button>
      <button class="chip" data-tab="members">👥 Members</button>
    </div>
    <div id="atab"></div>`;
  const tabs = app.querySelectorAll('[data-tab]');
  tabs.forEach(b => b.onclick = () => { tabs.forEach(x => x.classList.toggle('on', x === b)); loadTab(b.dataset.tab); });
  loadTab('requests');
}

async function loadTab(tab) {
  const box = document.getElementById('atab'); if (!box) return;
  box.innerHTML = '<p class="dim">Loading...</p>';
  if (tab === 'requests') {
    const { data, error } = await sb.from('access_requests').select('*').eq('status', 'pending').order('created_at');
    if (error) return box.innerHTML = `<p class="err">${esc(error.message)}</p>`;
    if (!data.length) return box.innerHTML = '<p class="dim">No pending requests.</p>';
    box.innerHTML = data.map(r => `
      <div style="background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #7873f51f;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1"><b>${esc(r.name)}</b><br><span class="dim">${esc(r.email)}</span><br><span class="dim" style="font-size:12px">${new Date(r.created_at).toLocaleString()}</span></div>
        <button data-approve="${esc(r.id)}" data-email="${esc(r.email)}" data-pw="${esc(r.pw_encrypted)}">✅ Approve</button>
        <button data-deny="${esc(r.id)}" style="background:#e11d48">❌ Deny</button>
      </div>`).join('');
    box.addEventListener('click', async e => {
      const ab = e.target.closest('[data-approve]'), db = e.target.closest('[data-deny]');
      if (ab) {
        ab.disabled = true;
        const { data: res, error } = await sb.rpc('approve_access_request', { p_request_id: ab.dataset.approve });
        if (error || !res?.ok) {
          ab.disabled = false;
          document.getElementById('atab').insertAdjacentHTML('afterbegin', `<p class="err">${esc(error?.message || res?.reason || 'Could not approve.')}</p>`);
          return;
        }
        ab.closest('div[style]').innerHTML = `<span class="dim">✅ Approved — ${esc(ab.dataset.email)}${res.existed ? ' (account already existed)' : ''}</span>`;
      }
      if (db) {
        db.disabled = true;
        await sb.from('access_requests').update({ status: 'denied' }).eq('id', db.dataset.deny);
        db.closest('div[style]').remove();
      }
    });
  } else {
    const { data, error } = await sb.from('channels').select('*').order('video_count', { ascending: false });
    if (error) return box.innerHTML = `<p class="err">${esc(error.message)}</p>`;
    const { data: bans } = await sb.from('banned_users').select('user_id');
    const bannedIds = new Set((bans || []).map(b => b.user_id));
    box.innerHTML = data.map(m => `
      <div style="background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 14px #7873f51f;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${avHtml(m.avatar_path, m.display_name || m.username, 42)}
        <div style="flex:1"><b>${esc(m.display_name || m.username)}</b> <span class="dim">@${esc(m.username)}</span><br>
          <span class="dim">${m.video_count} videos · ${m.subscriber_count} subscribers ${bannedIds.has(m.id) ? '· <span style="color:#e11d48">BANNED</span>' : ''}</span></div>
        ${m.id !== user.id ? `
          ${bannedIds.has(m.id)
            ? `<button data-unban="${esc(m.id)}" style="background:#16a34a">🔓 Unban</button>`
            : `<button data-ban="${esc(m.id)}" style="background:#f97316">🚫 Ban</button>`}
          <button data-deluser="${esc(m.id)}" style="background:#e11d48">🗑 Delete</button>` : '<span class="dim">You</span>'}
      </div>`).join('');
    box.addEventListener('click', async e => {
      const bb = e.target.closest('[data-ban]'), ub = e.target.closest('[data-unban]'), del = e.target.closest('[data-deluser]');
      if (bb) {
        if (!confirm(`Ban ${bb.dataset.ban}? They will be signed out and blocked.`)) return;
        await sb.from('banned_users').insert({ user_id: bb.dataset.ban });
        loadTab('members');
      }
      if (ub) { await sb.from('banned_users').delete().eq('user_id', ub.dataset.unban); loadTab('members'); }
      if (del) {
        if (!confirm('Delete this account permanently? This cannot be undone.')) return;
        await sb.from('profiles').delete().eq('id', del.dataset.deluser);
        loadTab('members');
      }
    });
  }
}


/* ---------- Shared helpers ---------- */
function onLeave(fn) { const prev = cleanup; cleanup = () => { prev(); fn(); }; }
async function signOutNow() {
  if (user) await sb.from('online_users').delete().eq('user_id', user.id);
  await sb.auth.signOut();
  myProfile = null;
  location.hash = '#/login';

/* ---------- Record / upload ---------- */
function recordPage() {
  app.innerHTML = `<h2>Record or upload</h2>
    <video id="live" autoplay muted playsinline></video>
    <p id="status"></p>
    <div id="controls"><button id="start">Start camera &amp; record</button>
      &nbsp;or pick a file: <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime"></div>
    <div id="review" style="display:none">
      <video id="prev" controls playsinline></video>
      <p id="info"></p>
      <input id="title" placeholder="Title" style="width:300px">
      <button id="upload">Upload</button> <button id="discard">Discard</button>
    </div>
    <p id="msg" class="err"></p>`;
  const $ = id => document.getElementById(id);
  let stream, rec, chunks = [], timer, blob, duration = 0;
  cleanup = () => { clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); };

  function showReview(b, secs) {
    blob = b; duration = secs;
    $('live').style.display = 'none'; $('controls').style.display = 'none'; $('review').style.display = '';
    $('prev').src = URL.createObjectURL(b);
    $('info').textContent = `${mm(secs)} · ${secs < 100 ? 'This will be a SHORT' : 'Regular video'} · ${(b.size / 1048576).toFixed(1)} MB`;
  }
  function stop() {
    clearInterval(timer);
    if (rec && rec.state !== 'inactive') rec.stop();
  }
  $('start').onclick = async () => {
    $('msg').textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { height: 720 }, audio: true });
      $('live').srcObject = stream;
      const mime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1000000 });
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const t0 = Date.now();
      rec.onstop = () => {
        const secs = (Date.now() - t0) / 1000;
        stream.getTracks().forEach(t => t.stop());
        $('status').textContent = '';
        showReview(new Blob(chunks, { type: rec.mimeType }), secs);
      };
      rec.start(1000);
      $('controls').innerHTML = '<button id="stop">Stop</button>';
      $('stop').onclick = stop;
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        $('status').textContent = `● Recording ${mm(s)} ${s < 100 ? '(short)' : '(over 1:40, regular video)'}`;
        if (s >= MAX_SECONDS) stop();
      }, 250);
    } catch (e) { $('msg').textContent = 'Could not access camera/mic: ' + e.message; }
  };
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(v.src); showReview(f, d); };
    v.src = URL.createObjectURL(f);
  };
  $('discard').onclick = recordPage;
  $('upload').onclick = async () => {
    const title = $('title').value.trim();
    if (!title) return $('msg').textContent = 'Add a title first.';
    $('upload').disabled = true; $('msg').textContent = 'Uploading...';
    const t = blob.type;
    const ext = t.includes('mp4') ? 'mp4' : t.includes('quicktime') ? 'mov' : 'webm';
    const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from('videos').upload(path, blob, { contentType: t.split(';')[0] });
    if (up.error) { $('upload').disabled = false; return $('msg').textContent = up.error.message; }
    const { data, error } = await sb.from('videos')
      .insert({ channel_id: user.id, title, video_path: path, duration_seconds: Math.max(duration, 0.1) })
      .select('id').single();
    if (error) { $('upload').disabled = false; return $('msg').textContent = error.message; }
    location.hash = '#/watch/' + data.id;
  };
}

/* ---------- Shorts (random order, swipe/scroll) ---------- */
let soundOn = true;
async function shortsPage() {
  app.innerHTML = '<p class="dim" style="padding:20px">Loading shorts...</p>';
  const { data, error } = await sb.from('video_feed').select('*').eq('is_short', true).eq('was_live', false).limit(60);
  if (error) return app.innerHTML = `<p class="err" style="padding:20px">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p style="padding:20px">No shorts yet. Record something under 1:40 and it shows up here.</p>';
  // shuffle (Fisher-Yates) so the order is different every visit
  for (let i = data.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [data[i], data[j]] = [data[j], data[i]]; }
  const { data: urls } = await sb.storage.from('videos').createSignedUrls(data.map(v => v.video_path), 3600);
  const urlFor = {}; (urls || []).forEach(u => { if (u.signedUrl) urlFor[u.path] = u.signedUrl; });
  const list = data.filter(v => urlFor[v.video_path]);
  if (!list.length) return app.innerHTML = '<p class="err" style="padding:20px">Could not load the short videos.</p>';

  app.innerHTML = '<div class="reel">' + list.map(v => `
    <section class="slide" data-id="${esc(v.id)}">
      <video loop playsinline preload="metadata" src="${esc(urlFor[v.video_path])}"></video>
      <div class="cap"><b>${esc(v.title)}</b><br><span class="dim">${esc(v.display_name || v.username)} · <a href="#/watch/${esc(v.id)}">comments</a></span></div>
      <button class="snd">${soundOn ? '🔊' : '🔇'}</button>
    </section>`).join('') + '</div>';

  const reel = app.querySelector('.reel');
  const counted = new Set();
  function play(vid) {
    vid.muted = !soundOn;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const vid = en.target.querySelector('video');
      if (en.isIntersecting) {
        play(vid);
        const id = en.target.dataset.id;
        if (!counted.has(id)) { counted.add(id); sb.rpc('increment_view', { p_video_id: id }); }
      } else { vid.pause(); vid.currentTime = 0; }
    });
  }, { root: reel, threshold: 0.7 });
  reel.querySelectorAll('.slide').forEach(sl => {
    io.observe(sl);
    const vid = sl.querySelector('video');
    vid.onclick = () => vid.paused ? vid.play() : vid.pause();
    sl.querySelector('.snd').onclick = () => {
      soundOn = !soundOn;
      reel.querySelectorAll('.snd').forEach(b => b.textContent = soundOn ? '🔊' : '🔇');
      reel.querySelectorAll('video').forEach(x => x.muted = !soundOn);
    };
  });
  cleanup = () => io.disconnect();
}

function waitForLiveChannel(channel) {
  return new Promise((resolve, reject) => {
    channel.subscribe(state => {
      if (state === 'SUBSCRIBED') resolve();
      else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT' || state === 'CLOSED') {
        reject(new Error(`Live connection failed (${state}).`));
      }
    });
  });
}

async function sendLiveEvent(channel, event, payload) {
  const result = await channel.send({ type: 'broadcast', event, payload });
  if (result !== 'ok') throw new Error(`Could not send live ${event} signal (${result}).`);
}

async function goLivePage(streamParam) {
  if (!user) {
    location.hash = '#/login';
    return;
  }
  // live_streams RLS requires host_id to belong to the authenticated user.
  const streamId = user.id;
  if (streamParam && streamParam !== streamId) {
    history.replaceState(null, '', '#/golive/' + streamId);
  }
  history.replaceState(null, '', '#/golive/' + streamId);
  app.innerHTML = `<div class="studio-head">
      <div>
        <h2 style="margin:0">Live Control Room</h2>
        <div id="studio-status" class="studio-status">Offline</div>
      </div>
      <div class="studio-url">
        <input id="share-url" readonly>
        <button id="copy-share">Copy viewer link</button>
      </div>
    </div>
    <div class="studio-tabs">
      <button class="studio-tab on" data-studio-tab="overview">Overview</button>
      <button class="studio-tab" data-studio-tab="chat">Live chat</button>
    </div>
    <div class="live-layout">
      <div class="live-main">
        <video id="preview" autoplay muted playsinline></video>
        <div><input id="live-title" placeholder="Stream title" style="width:260px">
          <button id="start-live">Start live</button>
          <button id="toggle-mic" style="display:none"></button>
          <button id="toggle-camera" style="display:none"></button>
          <button id="end-live" style="display:none;background:#e11d48">End stream</button>
        </div>
        <p id="live-viewers" class="dim"></p>
        <p id="live-msg" class="err"></p>
        <div id="pop" class="pop"></div>
        <div class="studio-metrics">
          <div class="studio-metric"><span class="dim">Status</span><b id="metric-status">Offline</b></div>
          <div class="studio-metric"><span class="dim">Viewers</span><b id="metric-viewers">0</b></div>
          <div class="studio-metric"><span class="dim">Stream ID</span><b style="font-size:12px;word-break:break-all">${esc(streamId)}</b></div>
        </div>
      </div>
      <aside class="live-chat">${chatHtml()}</aside>
    </div>`;
  let stream = null, channel = null, recorder = null, heartbeat = null, replayChunks = [];
  let replayPromise = Promise.resolve(), replayError = null, replaySaved = false;
  let startedAt = 0, ending = false, openReplay = false;
  const peers = new Map();
  const $ = id => document.getElementById(id);
  const shareUrl = location.origin + location.pathname + '#/live/' + streamId;
  $('share-url').value = shareUrl;
  $('copy-share').onclick = async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      $('copy-share').textContent = 'Copied';
      setTimeout(() => { $('copy-share').textContent = 'Copy viewer link'; }, 1500);
    } catch (_) {
      $('share-url').select();
    }
  };
  document.querySelectorAll('[data-studio-tab]').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('[data-studio-tab]').forEach(item => item.classList.toggle('on', item === tab));
      const chat = document.querySelector('.live-chat');
      if (chat) chat.style.display = tab.dataset.studioTab === 'chat' ? 'flex' : '';
    };
  });
  const name = await myName();
  const titleInput = $('live-title');
  const title = () => titleInput.value.trim() || 'Live stream';
  const showError = error => {
    const msg = $('live-msg');
    if (msg) msg.textContent = error.message || String(error);
  };
  const updateViewerCount = () => {
    const count = Object.values(channel?.presenceState() || {}).flat()
      .filter(presence => presence.role === 'viewer').length;
    const el = $('live-viewers');
    if (el) el.textContent = `${count} viewer${count === 1 ? '' : 's'}`;
    const metric = $('metric-viewers');
    if (metric) metric.textContent = String(count);
  };
  const saveReplay = async () => {
    if (!recorder || replaySaved) return;
    const blob = new Blob(replayChunks, { type: recorder.mimeType || 'video/webm' });
    if (!blob.size) return;
    const replayTitle = title();
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
    const upload = await sb.storage.from('videos').upload(path, blob, { contentType: blob.type.split(';')[0] });
    if (upload.error) throw upload.error;
    const { data, error } = await sb.from('videos').insert({
      channel_id: user.id,
      title: replayTitle,
      video_path: path,
      duration_seconds: Math.max((Date.now() - startedAt) / 1000, 0.1),
      was_live: true
    }).select('id').single();
    if (error) {
      const { error: removeError } = await sb.storage.from('videos').remove([path]);
      if (removeError) throw new Error(`${error.message} (Replay cleanup failed: ${removeError.message})`);
      throw error;
    }
    replaySaved = true;
    const msg = $('live-msg');
    if (msg) {
      msg.className = 'dim';
      msg.textContent = 'Replay saved.';
    }
    if (openReplay) location.hash = '#/watch/' + data.id;
  };
  const stopLive = async () => {
    if (ending) return;
    ending = true;
    clearInterval(heartbeat);
    let stopError = null;
    let replayPending = false, channelRemoved = false;
    const activeChannel = channel;
    try {
      if (activeChannel) {
        try { await sendLiveEvent(activeChannel, 'stream-ended', {}); }
        catch (error) { showError(error); }
      }
      for (const pc of peers.values()) pc.close();
      peers.clear();
      if (recorder?.state === 'recording') {
        const stopped = new Promise(resolve => recorder.addEventListener('stop', resolve, { once: true }));
        recorder.stop();
        stream?.getTracks().forEach(track => track.stop());
        await stopped;
      } else {
        stream?.getTracks().forEach(track => track.stop());
      }
      replayPending = !!recorder && replayChunks.length > 0 && !replaySaved;
      const { error } = await sb.from('live_streams').delete().eq('host_id', streamId);
      if (error) stopError ||= error;
      if (activeChannel) {
        const status = await sb.removeChannel(activeChannel);
        channelRemoved = true;
        if (status !== 'ok' && !stopError) stopError = new Error(`Could not close the live connection (${status}).`);
      }
      if (replayPending) {
        const msg = $('live-msg');
        if (msg) {
          msg.className = 'dim';
          msg.textContent = 'Saving replay...';
        }
        if (replayError) {
          replayError = null;
          replayPromise = saveReplay().catch(error => { replayError = error; throw error; });
        }
        try { await replayPromise; }
        catch (error) { replayError = error; stopError ||= error; showError(error); }
      }
    } finally {
      stream = null;
      channel = null;
      if (activeChannel && !channelRemoved) {
        const status = await sb.removeChannel(activeChannel);
        if (status !== 'ok' && !stopError) stopError = new Error(`Could not close the live connection (${status}).`);
      }
    }
    if (stopError) {
      ending = false;
      throw stopError;
    }
  };
  cleanup = () => { stopLive().catch(showError); };

  $('start-live').onclick = async () => {
    const startButton = $('start-live');
    startButton.disabled = true;
    ending = false;
    replayPromise = Promise.resolve();
    replayError = null;
    replaySaved = false;
    replayChunks = [];
    recorder = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { height: 480 }, audio: true });
      $('preview').srcObject = stream;
      const ice = await getIce();
      channel = sb.channel('live-' + streamId, {
        config: { broadcast: { self: false }, presence: { key: streamId } }
      });
      channel
        .on('broadcast', { event: 'viewer-join' }, async ({ payload }) => {
          if (!payload?.viewerId || peers.has(payload.viewerId) || !stream) return;
          try {
            const pc = new RTCPeerConnection(ice);
            peers.set(payload.viewerId, pc);
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            pc.onicecandidate = event => {
              if (event.candidate) sendLiveEvent(channel, 'ice', {
                to: payload.viewerId, from: streamId, candidate: event.candidate
              }).catch(showError);
            };
            pc.onconnectionstatechange = () => {
              if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                pc.close();
                peers.delete(payload.viewerId);
              }
            };
            await pc.setLocalDescription();
            await sendLiveEvent(channel, 'offer', {
              to: payload.viewerId, from: streamId, description: pc.localDescription
            });
          } catch (error) {
            showError(error);
            peers.get(payload.viewerId)?.close();
            peers.delete(payload.viewerId);
          }
        })
        .on('broadcast', { event: 'answer' }, async ({ payload }) => {
          if (payload?.to !== streamId) return;
          const pc = peers.get(payload.from);
          if (!pc) return;
          try {
            await pc.setRemoteDescription(payload.description);
            await flushIce(pc);
          } catch (error) { showError(error); }
        })
        .on('broadcast', { event: 'ice' }, async ({ payload }) => {
          if (payload?.to !== streamId) return;
          const pc = peers.get(payload.from);
          if (!pc) return;
          try { await addIce(pc, payload.candidate); }
          catch (error) { showError(error); }
        })
        .on('presence', { event: 'sync' }, updateViewerCount);
      wireChat(channel, name);
      await waitForLiveChannel(channel);
      const trackStatus = await channel.track({ role: 'host', name });
      if (trackStatus !== 'ok') throw new Error(`Could not publish stream presence (${trackStatus}).`);
      startedAt = Date.now();
      const liveTitle = title();
      const { error } = await sb.from('live_streams').upsert({ host_id: streamId, title: liveTitle, name });
      if (error) throw error;
      ending = false;
      updateViewerCount();
      $('live-title').disabled = true;
      startButton.style.display = 'none';
      $('toggle-mic').style.display = '';
      $('toggle-camera').style.display = '';
      $('end-live').style.display = '';
      $('studio-status').classList.add('live');
      $('studio-status').textContent = 'Live';
      $('metric-status').textContent = 'Live';
      $('toggle-mic').textContent = 'Mute microphone';
      $('toggle-camera').textContent = 'Turn camera off';
      const mime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
        .find(type => MediaRecorder.isTypeSupported(type));
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 1000000 } : { videoBitsPerSecond: 1000000 });
      replayChunks = [];
      recorder.ondataavailable = event => { if (event.data.size) replayChunks.push(event.data); };
      recorder.onstop = () => {
        replayPromise = saveReplay().catch(error => { replayError = error; showError(error); throw error; });
      };
      recorder.start(1000);
      heartbeat = setInterval(async () => {
        const { error: heartbeatError } = await sb.from('live_streams').upsert({ host_id: streamId, title: liveTitle, name });
        if (heartbeatError) showError(heartbeatError);
      }, 15000);
    } catch (error) {
      showError(error);
      try { await stopLive(); }
      catch (stopError) { showError(stopError); }
      startButton.disabled = false;
    }
  };
  $('toggle-mic').onclick = () => {
    const track = stream?.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    $('toggle-mic').textContent = track.enabled ? 'Mute microphone' : 'Unmute microphone';
  };
  $('toggle-camera').onclick = () => {
    const track = stream?.getVideoTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    $('toggle-camera').textContent = track.enabled ? 'Turn camera off' : 'Turn camera on';
  };
  $('end-live').onclick = async () => {
    $('end-live').disabled = true;
    openReplay = true;
    try {
      await stopLive();
      if (!location.hash.startsWith('#/watch/')) location.hash = '#/live';
    } catch (error) {
      showError(error);
      $('end-live').disabled = false;
    }
  };
}

async function watchLivePage(hostId) {
  app.innerHTML = `<h2>🔴 Live stream</h2><p class="dim">Connecting to this broadcaster...</p><p id="live-status" class="err"></p>`;
  const { data, error } = await sb.from('live_now').select('*').eq('host_id', hostId).maybeSingle();
  if (error) {
    document.getElementById('live-status').textContent = `Could not load this stream: ${error.message}`;
    return;
  }
  if (!data) {
    document.getElementById('live-status').textContent = 'This stream is no longer live.';
    return;
  }
  const viewerId = crypto.randomUUID();
  const name = await myName();
  app.innerHTML = `<h2>${esc(data.title)} <span class="tag" style="background:#e11d48">LIVE</span></h2>
    <p class="dim">${esc(data.name)} · <span id="live-viewers">Connecting...</span></p>
    <div class="live-layout">
      <div class="live-main">
        <video id="live-player" autoplay playsinline controls></video>
        <p id="live-status" class="dim">Connecting to the stream...</p>
        <div id="pop" class="pop"></div>
      </div>
      <aside class="live-chat">${chatHtml()}</aside>
    </div>`;
  const status = document.getElementById('live-status');
  const viewerCount = document.getElementById('live-viewers');
  let pc;
  let channel;
  let sawHost = false;
  try {
    pc = new RTCPeerConnection(await getIce());
    pc.ontrack = event => {
      const player = document.getElementById('live-player');
      if (player && event.streams[0]) {
        player.srcObject = event.streams[0];
        player.play().then(() => {
          status.textContent = 'You are watching live.';
        }).catch(() => {
          status.textContent = 'Stream connected. Press play to start watching.';
        });
      }
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') status.textContent = 'The live video connection failed. Try reloading the stream.';
      else if (pc.connectionState === 'disconnected') status.textContent = 'Connection interrupted; waiting to reconnect...';
    };
  } catch (error) {
    status.textContent = `Live video is unavailable: ${error.message}`;
  }
  const updatePresence = () => {
    const presence = Object.values(channel.presenceState()).flat();
    const hostOnline = presence.some(item => item.role === 'host');
    const count = presence.filter(item => item.role === 'viewer').length;
    viewerCount.textContent = `${count} viewer${count === 1 ? '' : 's'}`;
    if (sawHost && !hostOnline) status.textContent = 'The broadcaster ended the stream.';
    sawHost ||= hostOnline;
  };
  channel = sb.channel('live-' + hostId, {
    config: { broadcast: { self: false }, presence: { key: viewerId } }
  });
  channel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (payload?.to !== viewerId || !pc) return;
      try {
        await pc.setRemoteDescription(payload.description);
        await flushIce(pc);
        await pc.setLocalDescription();
        await sendLiveEvent(channel, 'answer', {
          to: hostId, from: viewerId, description: pc.localDescription
        });
      } catch (error) { status.textContent = `Could not connect to live video: ${error.message}`; }
    })
    .on('broadcast', { event: 'ice' }, async ({ payload }) => {
      if (payload?.to !== viewerId || !pc) return;
      try { await addIce(pc, payload.candidate); }
      catch (error) { status.textContent = `Could not connect to live video: ${error.message}`; }
    })
    .on('broadcast', { event: 'stream-ended' }, () => {
      status.textContent = 'The broadcaster ended the stream.';
      pc.close();
    })
    .on('presence', { event: 'sync' }, updatePresence);
  wireChat(channel, name);
  try {
    await waitForLiveChannel(channel);
    const trackStatus = await channel.track({ role: 'viewer', name });
    if (trackStatus !== 'ok') throw new Error(`Could not join the viewer list (${trackStatus}).`);
    await sendLiveEvent(channel, 'viewer-join', { viewerId, name });
    if (pc) status.textContent = 'Waiting for the broadcaster to connect...';
    updatePresence();
  } catch (error) {
    status.textContent = error.message;
    pc.close();
  }
  onLeave(() => {
    pc?.close();
    if (channel) sb.removeChannel(channel);
  });
}

/* ---------- Livestream (free, peer-to-peer: video goes straight from streamer to viewers) ---------- */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
// ---- Free relay so live video can get through school/strict networks ----
// Sign up free at metered.ca, create an app, then put its name and API key here:
const METERED_APP = 'ztube';   // the part before .metered.live, e.g. 'ztube'
const METERED_KEY = '047899aad9ccb84c486a967a0a4798791d35';   // your API key from the Metered dashboard
let iceCache = null;
async function getIce() {
  if (iceCache) return iceCache;
  if (METERED_APP && METERED_KEY) {
    try {
      const r = await fetch(`https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${METERED_KEY}`);
      if (r.ok) { iceCache = { iceServers: [...ICE.iceServers, ...(await r.json())] }; return iceCache; }
    } catch (e) {}
  }
  return ICE;
}
let myNameCache = null;
async function myName() {
  if (!myNameCache) {
    const { data } = await sb.from('profiles').select('username, display_name').eq('id', user.id).single();
    myNameCache = data?.display_name || data?.username || 'Guest';
  }
  return myNameCache;
}
async function addIce(pc, cand) {
  if (pc.remoteDescription) await pc.addIceCandidate(cand);
  else (pc._q = pc._q || []).push(cand);
}
async function flushIce(pc) { while (pc._q && pc._q.length) await pc.addIceCandidate(pc._q.shift()); }
function chatHtml() {
  return `<h3>Live chat</h3><div id="chatlog" style="height:260px;overflow-y:auto;background:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px #7873f524;margin-bottom:10px"></div>
    <input id="chattxt" placeholder="Say something" style="width:180px"><button id="chatsend">Send</button>
    <button id="chathl" title="Make your message stand out" style="margin-left:6px">⭐</button>
    <p id="chat-msg" class="err"></p>
    <div id="hlpanel" style="display:none;background:#fff;border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 6px 20px #7873f524">
      <b>Solve these to make your message stand out:</b>
      <p style="margin:10px 0 4px">10 × 5 = <input id="hl1" inputmode="numeric" style="width:70px;margin:0"></p>
      <p style="margin:4px 0">3 × 40 = <input id="hl2" inputmode="numeric" style="width:70px;margin:0"></p>
      <p style="margin:4px 0 10px">12 × 5 = <input id="hl3" inputmode="numeric" style="width:70px;margin:0"></p>
      <button id="hlgo">⭐ Send highlighted</button> <span id="hlmsg" class="err" style="margin-left:6px"></span>
    </div>`;
}
function addChat(name, text, hl) {
  const log = document.getElementById('chatlog'); if (!log) return;
  const style = hl
    ? 'margin:8px 0;padding:8px 12px;border-radius:12px;font-weight:600;background:linear-gradient(90deg,#ffe29a,#ffb3c6);box-shadow:0 0 14px #ffb74d99'
    : 'margin:4px 0';
  log.insertAdjacentHTML('beforeend', `<p style="${style}">${hl ? '⭐ ' : ''}<b>${esc(name)}</b> ${esc(text)}</p>`);
  log.scrollTop = log.scrollHeight;
}
// a highlighted message also pops up on top of the stream for 8 seconds
function popup(name, text) {
  const box = document.getElementById('pop'); if (!box) return;
  const el = document.createElement('div'); el.className = 'hl';
  el.innerHTML = `⭐ <b>${esc(name)}</b> ${esc(text)}`;
  box.appendChild(el); setTimeout(() => el.remove(), 8000);
}
function wireChat(ch, name) {
  const $ = id => document.getElementById(id);
  const send = async hl => {
    const t = $('chattxt').value.trim(); if (!t) return false;
    const text = t.slice(0, 300);
    try {
      const result = await ch.send({ type: 'broadcast', event: 'chat', payload: { name, text, hl: !!hl } });
      if (result !== 'ok') throw new Error(`Could not send chat message (${result}).`);
    } catch (error) {
      $('chat-msg').textContent = error.message || String(error);
      return false;
    }
    $('chat-msg').textContent = '';
    addChat(name, text, hl); if (hl) popup(name, text); $('chattxt').value = '';
    return true;
  };
  $('chatsend').onclick = () => { send(false); };
  $('chattxt').onkeydown = e => { if (e.key === 'Enter') send(false); };
  $('chathl').onclick = () => {
    const panel = $('hlpanel');
    panel.style.display = panel.style.display === 'none' ? '' : 'none';
    $('hlmsg').textContent = '';
  };
  $('hlgo').onclick = async () => {
    if (!$('chattxt').value.trim()) return $('hlmsg').textContent = 'Type your message first.';
    const ok = $('hl1').value.trim() === '50' && $('hl2').value.trim() === '120' && $('hl3').value.trim() === '60';
    if (!ok) return $('hlmsg').textContent = 'Not quite, try again.';
    if (!await send(true)) return;
    ['hl1', 'hl2', 'hl3'].forEach(id => $(id).value = '');
    $('hlpanel').style.display = 'none'; $('hlmsg').textContent = '';
  };
  ch.on('broadcast', { event: 'chat' }, ({ payload }) => { addChat(payload.name, payload.text, payload.hl === true); if (payload.hl === true) popup(payload.name, payload.text); });
}

/* ---------- ZChat: Zoom-style video calls with a meeting ID ---------- */
function genZChatId() {
  return Array.from({length:9}, () => Math.floor(Math.random()*10)).join('');
}
function fmtId(id) {
  const c = id.replace(/\D/g,'');
  return c.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3');
}

async function verifyZChatRoom(roomId) {
  const channel = sb.channel('zchat-' + roomId, {
    config: { presence: { key: 'verify-' + (user?.id || Math.random().toString(36).slice(2)) } }
  });
  let timer;
  try {
    return await new Promise((resolve, reject) => {
      let settled = false;
      const finish = (valid, error) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (error) reject(error);
        else resolve(valid);
      };
      const checkForHost = () => {
        const hasHost = Object.values(channel.presenceState()).flat()
          .some(item => item.role === 'host');
        if (hasHost) finish(true);
      };
      timer = setTimeout(() => finish(false), 5000);
      channel
        .on('presence', { event: 'sync' }, checkForHost)
        .subscribe(state => {
          if (state === 'SUBSCRIBED') checkForHost();
          else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT' || state === 'CLOSED') {
            finish(false, new Error(`Could not verify the meeting ID (${state}).`));
          }
        });
    });
  } finally {
    clearTimeout(timer);
    await sb.removeChannel(channel);
  }
}

async function zChatJoin(roomId, displayName, isHost = false) {
  const clean = roomId.replace(/\D/g,'');
  const name = displayName || (user ? (myProfile?.display_name || myProfile?.username || '') : '');
  if (!name) {
    app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">

      <p class="dim">ID: ${esc(fmtId(clean))}</p>
      <input id="gname" placeholder="Your name" style="width:100%;box-sizing:border-box">
      <button id="gnbtn" style="margin-top:12px;width:100%">Join</button>
    </div>`;
    document.getElementById('gnbtn').onclick = () => {
      const n = document.getElementById('gname').value.trim();
      if (n) zChatJoin(roomId, n, isHost);
    };
    return;
  }

  if (!isHost) {
    app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">
      <h2>📹 ZChat</h2>
      <p class="dim">Verifying meeting ID...</p>
    </div>`;
    try {
      if (!(await verifyZChatRoom(clean))) {
        app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">
          <h2>📹 ZChat</h2>
          <p class="err">Invalid meeting ID. No active call was found for this code.</p>
          <a href="#/zchat">Back to ZChat</a>
        </div>`;
        return;
      }
    } catch (error) {
      app.innerHTML = `<div style="max-width:360px;margin:60px auto;text-align:center">
        <h2>📹 ZChat</h2>
        <p class="err">${esc(error.message || 'Could not verify the meeting ID.')}</p>
        <a href="#/zchat">Back to ZChat</a>
      </div>`;
      return;
    }
  }

  const ice  = await getIce();
  const pcs  = {};
  const myId = user?.id || ('g-' + Math.random().toString(36).slice(2));
  let localStream = null;
  const ch = sb.channel('zchat-' + clean, {
    config: { broadcast: { self: false }, presence: { key: myId } }
  });

  app.innerHTML = `<div style="max-width:960px;margin:0 auto;padding:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <h2 style="margin:0">📹 ZChat</h2>
      <span class="dim">ID: <b>${esc(fmtId(clean))}</b></span>
      <button id="cpid" style="background:#fff;color:var(--ink);box-shadow:0 2px 8px #7873f526;padding:5px 12px;font-size:13px">📋 Copy ID</button>
      <span style="flex:1"></span>
      ${isHost ? '<button id="endall" style="background:#e11d48">⏹ End for everyone</button>' : ''}
      <button id="leavebtn" style="background:#6b6890">Leave</button>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <div style="flex:2;min-width:300px">
        <div id="vtiles" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
          <div style="position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3">
            <video id="selfvid" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video>
            <div style="position:absolute;bottom:8px;left:10px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000">${esc(name)} (you)</div>
            <div style="position:absolute;top:8px;right:8px;display:flex;gap:6px">
              <button id="mutebtn" style="width:32px;height:32px;padding:0;font-size:14px;background:#0009">🎤</button>
              <button id="cambtn"  style="width:32px;height:32px;padding:0;font-size:14px;background:#0009">📷</button>
            </div>
          </div>
        </div>
        <p id="connmsg" class="dim" style="margin-top:8px">Starting camera...</p>
      </div>
      <div style="flex:1;min-width:240px">
        <h3 style="margin:0 0 6px">👥 Participants <span id="pcount">(1)</span></h3>
        <div id="plist" class="dim" style="font-size:13px;margin-bottom:12px">${esc(name)} (you)</div>
        <hr style="border:0;border-top:1px solid #e3e1fb;margin-bottom:12px">
        <h3 style="margin:0 0 6px">💬 Chat</h3>
        <div id="chatlog" style="height:200px;overflow-y:auto;background:#fff;border-radius:14px;padding:10px;box-shadow:0 4px 14px #7873f51f;margin-bottom:8px;font-size:13px"></div>
        <input id="chattxt" placeholder="Message..." style="width:calc(100% - 70px)">
        <button id="chatsnd" style="margin-left:6px">Send</button>
      </div>
    </div>
  </div>`;

  document.getElementById('cpid').onclick = () => {
    navigator.clipboard?.writeText(fmtId(clean)).catch(() => {});
    const b = document.getElementById('cpid'); b.textContent = '✓ Copied!';
    setTimeout(() => { const btn = document.getElementById('cpid'); if (btn) btn.textContent = '📋 Copy ID'; }, 2000);
  };

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('selfvid').srcObject = localStream;
    document.getElementById('connmsg').textContent = 'Ready. Waiting for others to join...';
  } catch(e) {
    document.getElementById('connmsg').textContent = 'Could not access camera/mic: ' + e.message;
  }

  let muted = false, camOff = false;
  document.getElementById('mutebtn').onclick = () => {
    muted = !muted; localStream?.getAudioTracks().forEach(t => t.enabled = !muted);
    document.getElementById('mutebtn').textContent = muted ? '🔇' : '🎤';
  };
  document.getElementById('cambtn').onclick = () => {
    camOff = !camOff; localStream?.getVideoTracks().forEach(t => t.enabled = !camOff);
    document.getElementById('cambtn').textContent = camOff ? '🚫' : '📷';
  };

  const addChat = (from, text) => {
    const log = document.getElementById('chatlog'); if (!log) return;
    log.insertAdjacentHTML('beforeend', `<p style="margin:3px 0"><b>${esc(from)}</b> ${esc(text)}</p>`);
    log.scrollTop = log.scrollHeight;
  };
  document.getElementById('chatsnd').onclick = () => {
    const t = document.getElementById('chattxt').value.trim(); if (!t) return;
    ch.send({ type: 'broadcast', event: 'zchat-msg', payload: { from: name, text: t } });
    addChat(name + ' (you)', t);
    document.getElementById('chattxt').value = '';
  };
  document.getElementById('chattxt').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('chatsnd').click(); });

  const leaveRoom = (endAll = false) => {
    if (endAll) ch.send({ type: 'broadcast', event: 'zchat-end', payload: {} });
    localStream?.getTracks().forEach(t => t.stop());
    Object.values(pcs).forEach(pc => pc.close());
    sb.removeChannel(ch);
    location.hash = '#/';
  };
  document.getElementById('leavebtn').onclick = () => leaveRoom(false);
  if (isHost) document.getElementById('endall').onclick = () => { if (confirm('End for everyone?')) leaveRoom(true); };

  const updatePList = () => {
    const all = Object.values(ch.presenceState()).flatMap(a => a.map(x => x.name || '?'));
    const unique = [...new Set([name + ' (you)', ...all.filter(n => n !== name)])];
    const pe = document.getElementById('plist'); if (pe) pe.textContent = unique.join(', ');
    const ce = document.getElementById('pcount'); if (ce) ce.textContent = '(' + unique.length + ')';
  };

  const addTile = (pid, pname) => {
    if (document.getElementById('tile-' + pid)) return;
    const tiles = document.getElementById('vtiles'); if (!tiles) return;
    const div = document.createElement('div');
    div.id = 'tile-' + pid;
    div.style.cssText = 'position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3';
    div.innerHTML = `<video id="vid-${esc(pid)}" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;bottom:8px;left:10px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000">${esc(pname)}</div>`;
    tiles.appendChild(div);
  };
  const removeTile = pid => document.getElementById('tile-' + pid)?.remove();

  const makePc = async (pid, pname) => {
    if (pcs[pid]) return pcs[pid];
    const pc = new RTCPeerConnection(ice); pcs[pid] = pc;
    addTile(pid, pname);
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.ontrack = e => { const v = document.getElementById('vid-' + pid); if (v) v.srcObject = e.streams[0]; };
    pc.onicecandidate = e => e.candidate && ch.send({ type: 'broadcast', event: 'zchat-ice',
      payload: { to: pid, from: myId, cand: e.candidate } });
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        pc.close(); delete pcs[pid]; removeTile(pid); updatePList();
      }
    };
    let makingOffer = false;
    pc.onnegotiationneeded = async () => {
      try {
        makingOffer = true; await pc.setLocalDescription();
        ch.send({ type: 'broadcast', event: 'zchat-sdp',
          payload: { to: pid, from: myId, name, sdp: pc.localDescription } });
      } catch(e) {} finally { makingOffer = false; }
    };
    pc._polite = myId < pid;
    pc._handleSdp = async sdp => {
      const collision = sdp.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
      if (!pc._polite && collision) return;
      await pc.setRemoteDescription(sdp); await flushIce(pc);
      if (sdp.type === 'offer') {
        await pc.setLocalDescription();
        ch.send({ type: 'broadcast', event: 'zchat-sdp',
          payload: { to: pid, from: myId, name, sdp: pc.localDescription } });
      }
    };
    return pc;
  };

  ch.on('broadcast', { event: 'zchat-sdp' }, async ({ payload }) => {
      if (payload.to !== myId) return;
      const pc = await makePc(payload.from, payload.name || payload.from);
      await pc._handleSdp(payload.sdp);
    })
    .on('broadcast', { event: 'zchat-ice' }, async ({ payload }) => {
      if (payload.to !== myId || !pcs[payload.from]) return;
      addIce(pcs[payload.from], payload.cand);
    })
    .on('broadcast', { event: 'zchat-msg' }, ({ payload }) => addChat(payload.from, payload.text))
    .on('broadcast', { event: 'zchat-end' }, () => { alert('The host ended the call.'); leaveRoom(false); })
    .on('presence', { event: 'sync' }, async () => {
      updatePList();
      for (const [pid, arr] of Object.entries(ch.presenceState())) {
        if (pid === myId) continue;
        const pc = await makePc(pid, arr[0]?.name || pid);
        if (pc.signalingState === 'stable' && !pc.pendingLocalDescription) {
          pc.onnegotiationneeded?.();
        }
      }
      for (const pid of Object.keys(pcs)) {
        if (!ch.presenceState()[pid]) { pcs[pid]?.close(); delete pcs[pid]; removeTile(pid); updatePList(); }
      }
    })
    .subscribe(async st => {
      if (st === 'SUBSCRIBED') await ch.track({ name, role: isHost ? 'host' : 'guest' });
    });

  onLeave(() => { localStream?.getTracks().forEach(t => t.stop()); Object.values(pcs).forEach(pc => pc.close()); sb.removeChannel(ch); });
}

/* ---------- Boot: every tab gets its own private login ---------- */
async function boot() {
  const claim = id => new Promise(resolve => {
    if (!navigator.locks) return resolve(true);
    // a tab "owns" its id for as long as it is open; a duplicated tab finds it taken
    navigator.locks.request('ztube-tab-' + id, { ifAvailable: true }, lock => {
      if (!lock) { resolve(false); return; }
      resolve(true);
      return new Promise(() => {});
    });
  });
  let id = sessionStorage.getItem('ztube-tab');
  if (!id || !(await claim(id))) {
    const old = id;
    id = Math.random().toString(36).slice(2);
    await claim(id);
    if (old) { // duplicated tab: start with the same account, but a separate login from here on
      const copy = sessionStorage.getItem('ztube-auth-' + old);
      if (copy) sessionStorage.setItem('ztube-auth-' + id, copy);
    }
    sessionStorage.setItem('ztube-tab', id);
  }
  sb = supabase.createClient(
    'https://ejwcxwzxlekoutknngtz.supabase.co',
    'sb_publishable_b_XTX9vAZkQoW8TfafjMgQ_vn-nR0Ye',
    { auth: { storage: window.sessionStorage, storageKey: 'ztube-auth-' + id } }
  );
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { myProfile = null; location.hash = '#/login'; } });
  const publicHash = (location.hash || '').startsWith('#/zchat') || (location.hash || '').startsWith('#/call');
  if (!sessionStorage.getItem('wallah_agreed') && !publicHash) showWallah();
  new MutationObserver(() => fillAvatars()).observe(document.body, { childList: true, subtree: true });
  if (document.getElementById('invsend')) document.getElementById('invsend').onclick = sendInvite;
  document.getElementById('q').addEventListener('keydown', e => {
    const v = e.target.value.trim();
    if (e.key === 'Enter' && v) location.hash = '#/search/' + encodeURIComponent(v);
  });
}
async function updateLiveDot() {
  const el = document.getElementById('livelink');
  if (!el || !user || document.hidden) return;
  const { count } = await sb.from('live_now').select('*', { count: 'exact', head: true });
  el.textContent = count ? `🔴 Live (${count})` : '🔴 Live';
}
setInterval(updateLiveDot, 8000);
boot().then(() => { route(); setTimeout(updateLiveDot, 1500); });
