<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZTube</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2d2a4a;--muted:#6b6890;--p1:#ff6ec4;--p2:#7873f5}
  *{box-sizing:border-box}
  body{font-family:'Poppins',system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
       background:linear-gradient(160deg,#fff1f8 0%,#eef2ff 55%,#e6fbff 100%) fixed}
  nav{display:flex;gap:22px;padding:0 24px;height:52px;background:#ffffffd9;backdrop-filter:blur(8px);
      align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #7873f526}
  nav a{color:var(--ink);text-decoration:none;font-weight:500}
  nav a:hover{color:var(--p2)}
  nav a.brand{font-weight:700;font-size:20px;background:linear-gradient(90deg,var(--p1),var(--p2));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  main{padding:24px;max-width:1000px;margin:0 auto}
  h2,h3{margin:.4em 0}
  a{color:var(--p2)}
  button{border:0;border-radius:999px;padding:10px 22px;font:600 15px 'Poppins',system-ui,sans-serif;color:#fff;cursor:pointer;
         background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 4px 14px #7873f540;transition:transform .15s}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:default;transform:none}
  input{border:2px solid #e3e1fb;border-radius:12px;padding:10px 14px;font:15px 'Poppins',system-ui,sans-serif;
        margin:0 8px 10px 0;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--p2)}
  video{width:100%;max-width:640px;background:#1e1b4b;border-radius:16px;display:block;margin-bottom:12px;
        box-shadow:0 10px 30px #7873f533}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:#fff;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;display:block;
        box-shadow:0 6px 20px #7873f524;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7873f53d}
  .thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;position:relative}
  .dur{position:absolute;right:10px;bottom:8px;background:#0000008c;font-size:12px;padding:2px 8px;border-radius:999px}
  .body{padding:12px 16px 14px}
  .tag{background:linear-gradient(90deg,#ff6ec4,#ff9a44);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .dim{color:var(--muted);font-size:13px}.err{color:#e11d48}
  main.full{padding:0;max-width:none}
  .reel{height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow-y:scroll;scroll-snap-type:y mandatory;
        background:linear-gradient(160deg,#6a11cb,#2575fc 60%,#ff6ec4)}
  .slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center}
  .slide::after{content:'';position:absolute;left:0;right:0;bottom:0;height:35%;
        background:linear-gradient(transparent,#1e1b4bcc);pointer-events:none}
  .slide video{height:100%;width:auto;max-width:100%;margin:0;border-radius:0;box-shadow:none;object-fit:contain}
  .cap{position:absolute;z-index:2;left:18px;right:76px;bottom:22px;color:#fff;text-shadow:0 1px 4px #0008;pointer-events:none}
  .cap .dim{color:#ffffffdd}
  .cap a{pointer-events:auto;color:#fff;font-weight:600}
  .snd{position:absolute;z-index:2;right:16px;bottom:26px;width:46px;height:46px;padding:0;font-size:20px;
       background:#ffffff38;backdrop-filter:blur(6px);box-shadow:none}
</style>
</head>
<body>
<nav>
  <a href="#/" class="brand">▶ ZTube</a>
  <a href="#/shorts">Shorts</a>
  <a href="#/record">Record / Upload</a>
  <span style="flex:1"></span>
  <span id="who" class="dim"></span>
  <a href="#/login" id="out" style="display:none">Sign out</a>
</nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://ejwcxwzxlekoutknngtz.supabase.co',
  'sb_publishable_b_XTX9vAZkQoW8TfafjMgQ_vn-nR0Ye'
);
const app = document.getElementById('app');
const MAX_SECONDS = 300; // keeps recordings under the 50 MB free-tier file limit
let user = null, cleanup = () => {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function route() {
  cleanup(); cleanup = () => {};
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  document.getElementById('who').textContent = user ? user.email : '';
  document.getElementById('out').style.display = user ? '' : 'none';
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  app.className = '';
  if (parts[0] === 'login') return loginPage();
  if (!user) { location.hash = '#/login'; return; }
  app.className = parts[0] === 'shorts' ? 'full' : '';
  if (parts[0] === 'shorts') return shortsPage();
  if (parts[0] === 'record') return recordPage();
  if (parts[0] === 'watch') return watchPage(parts[1]);
  return homePage();
}
window.addEventListener('hashchange', route);
document.getElementById('out').onclick = async () => { await sb.auth.signOut(); };
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.hash = '#/login'; });

/* ---------- Login ---------- */
function loginPage() {
  app.innerHTML = `<div style="max-width:320px;margin:60px auto"><h2>Sign in</h2>
    <input id="em" placeholder="Email" style="width:100%;box-sizing:border-box">
    <input id="pw" type="password" placeholder="Password (6+ characters)" style="width:100%;box-sizing:border-box">
    <button id="in">Sign in</button> <button id="up">Create account</button><p id="msg" class="err"></p></div>`;
  const msg = document.getElementById('msg');
  async function go(mode) {
    msg.textContent = '';
    const creds = { email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value };
    const { data, error } = mode === 'in' ? await sb.auth.signInWithPassword(creds) : await sb.auth.signUp(creds);
    if (error) return msg.textContent = error.message;
    if (mode === 'up' && !data.session) return msg.textContent = 'Account created. Check your email to confirm, then sign in.';
    location.hash = '#/';
  }
  document.getElementById('in').onclick = () => go('in');
  document.getElementById('up').onclick = () => go('up');
}

/* ---------- Home feed ---------- */
async function homePage() {
  app.innerHTML = '<p class="dim">Loading...</p>';
  const { data, error } = await sb.from('video_feed').select('*').order('created_at', { ascending: false });
  if (error) return app.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p>No videos yet. Go to Record / Upload to make the first one.</p>';
  const hue = id => parseInt(id.slice(0, 4), 16) % 360;
  app.innerHTML = '<div class="grid">' + data.map(v => `
    <a class="card" href="#/watch/${esc(v.id)}">
      <div class="thumb" style="background:linear-gradient(135deg,hsl(${hue(v.id)},85%,68%),hsl(${(hue(v.id) + 60) % 360},85%,62%))">▶<span class="dur">${mm(v.duration_seconds)}</span></div>
      <div class="body">
        <div style="font-weight:600">${esc(v.title)} ${v.is_short ? '<span class="tag">SHORT</span>' : ''}</div>
        <div class="dim" style="margin-top:4px">${esc(v.display_name || v.username)} · ${v.view_count} views</div>
      </div>
    </a>`).join('') + '</div>';
}

/* ---------- Record / upload ---------- */
function recordPage() {
  app.innerHTML = `<h2>Record or upload</h2>
    <video id="live" autoplay muted playsinline></video>
    <p id="status"></p>
    <div id="controls"><button id="start">Start camera &amp; record</button>
      &nbsp;or pick a file: <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime"></div>
    <div id="review" style="display:none">
      <video id="prev" controls playsinline></video>
      <p id="info"></p>
      <input id="title" placeholder="Title" style="width:300px">
      <button id="upload">Upload</button> <button id="discard">Discard</button>
    </div>
    <p id="msg" class="err"></p>`;
  const $ = id => document.getElementById(id);
  let stream, rec, chunks = [], timer, blob, duration = 0;
  cleanup = () => { clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); };

  function showReview(b, secs) {
    blob = b; duration = secs;
    $('live').style.display = 'none'; $('controls').style.display = 'none'; $('review').style.display = '';
    $('prev').src = URL.createObjectURL(b);
    $('info').textContent = `${mm(secs)} · ${secs < 100 ? 'This will be a SHORT' : 'Regular video'} · ${(b.size / 1048576).toFixed(1)} MB`;
  }
  function stop() {
    clearInterval(timer);
    if (rec && rec.state !== 'inactive') rec.stop();
  }
  $('start').onclick = async () => {
    $('msg').textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { height: 720 }, audio: true });
      $('live').srcObject = stream;
      const mime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1000000 });
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const t0 = Date.now();
      rec.onstop = () => {
        const secs = (Date.now() - t0) / 1000;
        stream.getTracks().forEach(t => t.stop());
        $('status').textContent = '';
        showReview(new Blob(chunks, { type: rec.mimeType }), secs);
      };
      rec.start(1000);
      $('controls').innerHTML = '<button id="stop">Stop</button>';
      $('stop').onclick = stop;
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        $('status').textContent = `● Recording ${mm(s)} ${s < 100 ? '(short)' : '(over 1:40, regular video)'}`;
        if (s >= MAX_SECONDS) stop();
      }, 250);
    } catch (e) { $('msg').textContent = 'Could not access camera/mic: ' + e.message; }
  };
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(v.src); showReview(f, d); };
    v.src = URL.createObjectURL(f);
  };
  $('discard').onclick = recordPage;
  $('upload').onclick = async () => {
    const title = $('title').value.trim();
    if (!title) return $('msg').textContent = 'Add a title first.';
    $('upload').disabled = true; $('msg').textContent = 'Uploading...';
    const t = blob.type;
    const ext = t.includes('mp4') ? 'mp4' : t.includes('quicktime') ? 'mov' : 'webm';
    const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from('videos').upload(path, blob, { contentType: t.split(';')[0] });
    if (up.error) { $('upload').disabled = false; return $('msg').textContent = up.error.message; }
    const { data, error } = await sb.from('videos')
      .insert({ channel_id: user.id, title, video_path: path, duration_seconds: Math.max(duration, 0.1) })
      .select('id').single();
    if (error) { $('upload').disabled = false; return $('msg').textContent = error.message; }
    location.hash = '#/watch/' + data.id;
  };
}

/* ---------- Watch page ---------- */
async function watchPage(id) {
  app.innerHTML = '<p class="dim">Loading...</p>';
  const { data: v, error } = await sb.from('video_feed').select('*').eq('id', id).single();
  if (error) return app.innerHTML = `<p class="err">Could not load this video: ${esc(error.message)}</p>`;
  const { data: s, error: se } = await sb.storage.from('videos').createSignedUrl(v.video_path, 3600);
  app.innerHTML = `${se ? `<p class="err">Could not get the video file: ${esc(se.message)}</p>` : `<video id="player" controls autoplay playsinline style="max-width:100%;max-height:70vh"></video>`}
    <h2>${esc(v.title)}</h2>
    <p class="dim">${esc(v.display_name || v.username)} · ${v.view_count} views · ${v.is_short ? 'Short' : 'Video'}</p>
    <h3 id="count"></h3>
    <input id="txt" placeholder="Add a comment" style="width:320px"><button id="post">Post</button>
    <p id="msg" class="err"></p><div id="list"></div>`;
  if (!se) document.getElementById('player').src = s.signedUrl;
  sb.rpc('increment_view', { p_video_id: id });
  sb.from('watch_history').upsert({ user_id: user.id, video_id: id, watched_at: new Date().toISOString() });

  async function load() {
    const { data } = await sb.from('comments').select('id, body, profiles(username, display_name)')
      .eq('video_id', id).order('created_at', { ascending: true });
    document.getElementById('count').textContent = `${(data || []).length} comments`;
    document.getElementById('list').innerHTML = (data || [])
      .map(c => `<p><b>${esc(c.profiles?.display_name || c.profiles?.username)}</b> ${esc(c.body)}</p>`).join('');
  }
  load();
  const ch = sb.channel('comments-' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments', filter: `video_id=eq.${id}` }, load)
    .subscribe();
  cleanup = () => sb.removeChannel(ch);
  document.getElementById('post').onclick = async () => {
    const body = document.getElementById('txt').value.trim(); if (!body) return;
    const { error } = await sb.from('comments').insert({ video_id: id, user_id: user.id, body });
    if (error) return document.getElementById('msg').textContent = error.message;
    document.getElementById('txt').value = ''; load();
  };
}

/* ---------- Shorts (random order, swipe/scroll) ---------- */
let soundOn = true;
async function shortsPage() {
  app.innerHTML = '<p class="dim" style="padding:20px">Loading shorts...</p>';
  const { data, error } = await sb.from('video_feed').select('*').eq('is_short', true).limit(60);
  if (error) return app.innerHTML = `<p class="err" style="padding:20px">${esc(error.message)}</p>`;
  if (!data.length) return app.innerHTML = '<p style="padding:20px">No shorts yet. Record something under 1:40 and it shows up here.</p>';
  // shuffle (Fisher-Yates) so the order is different every visit
  for (let i = data.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [data[i], data[j]] = [data[j], data[i]]; }
  const { data: urls } = await sb.storage.from('videos').createSignedUrls(data.map(v => v.video_path), 3600);
  const urlFor = {}; (urls || []).forEach(u => { if (u.signedUrl) urlFor[u.path] = u.signedUrl; });
  const list = data.filter(v => urlFor[v.video_path]);
  if (!list.length) return app.innerHTML = '<p class="err" style="padding:20px">Could not load the short videos.</p>';

  app.innerHTML = '<div class="reel">' + list.map(v => `
    <section class="slide" data-id="${esc(v.id)}">
      <video loop playsinline preload="metadata" src="${esc(urlFor[v.video_path])}"></video>
      <div class="cap"><b>${esc(v.title)}</b><br><span class="dim">${esc(v.display_name || v.username)} · <a href="#/watch/${esc(v.id)}">comments</a></span></div>
      <button class="snd">${soundOn ? '🔊' : '🔇'}</button>
    </section>`).join('') + '</div>';

  const reel = app.querySelector('.reel');
  const counted = new Set();
  function play(vid) {
    vid.muted = !soundOn;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const vid = en.target.querySelector('video');
      if (en.isIntersecting) {
        play(vid);
        const id = en.target.dataset.id;
        if (!counted.has(id)) { counted.add(id); sb.rpc('increment_view', { p_video_id: id }); }
      } else { vid.pause(); vid.currentTime = 0; }
    });
  }, { root: reel, threshold: 0.7 });
  reel.querySelectorAll('.slide').forEach(sl => {
    io.observe(sl);
    const vid = sl.querySelector('video');
    vid.onclick = () => vid.paused ? vid.play() : vid.pause();
    sl.querySelector('.snd').onclick = () => {
      soundOn = !soundOn;
      reel.querySelectorAll('.snd').forEach(b => b.textContent = soundOn ? '🔊' : '🔇');
      reel.querySelectorAll('video').forEach(x => x.muted = !soundOn);
    };
  });
  cleanup = () => io.disconnect();
}

route();
</script>
</body>
</html>
